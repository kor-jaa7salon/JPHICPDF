<style>
:root {
  --c-bg: #0d0d0d;
  --c-card: #141414;
  --c-card-hover: #1a1a1a;
  --c-text: #ffffff;
  --c-text-muted: #888888;
  --c-border: #222222;
  --c-core: #ff5a00;
  --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-main);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }

.universe-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 80px 20px;
}

header {
  text-align: center;
  margin-bottom: 60px;
}
header h1 {
  font-size: 2.5rem;
  font-weight: 900;
  letter-spacing: -0.05em;
  margin-bottom: 15px;
  background: linear-gradient(135deg, #fff 0%, #888 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
header p {
  color: var(--var-text-muted, var(--c-text-muted));
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: -0.02em;
}

.grid-channels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
  margin-bottom: 60px;
}

.channel-card {
  background: var(--c-card);
  border: 1px solid var(--c-border);
  border-radius: 20px;
  padding: 40px 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  position: relative;
  overflow: hidden;
}
.channel-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: radial-gradient(circle at top right, rgba(255,90,0,0.05) 0%, transparent 60%);
  opacity: 0;
  transition: opacity 0.3

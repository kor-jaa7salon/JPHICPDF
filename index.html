<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPHIC UNIVERSE</title>

    <!-- [파비콘 설정] public 폴더의 자산을 루트(/) 경로로 호출 -->
    <link rel="icon" href="/favicon-uv.png" type="image/png">
    <link rel="apple-touch-icon" href="/favicon-uv.png">

    <!-- [메타 태그 / OG 이미지] 공유 시 og-universe.jpg가 나타나도록 설정 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="JPHIC UNIVERSE">
    <meta property="og:description" content="아이디어를 무한히 확장되는 브랜드 자산으로 만드는 5단계 솔루션">
    <meta property="og:image" content="/og-universe.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="/og-universe.jpg">

    <style>
        :root {
            --bg-color: #f4f1ee; /* Neutral Sand / Greige */
            --point-orange: #d35400; /* Brick Orange */
            --text-main: #2d2d2d;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: 'Pretendard', sans-serif;
            color: var(--text-main);
            overflow: hidden;
        }

        .universe-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 슬라이더 스타일 */
        .hero-slider {
            position: relative;
            width: 80%;
            max-width: 1200px;
            height: 400px;
        }

        .hero-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateX(80px); /* 우측 대기 */
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        /* 활성화된 슬라이드 (중앙 등장) */
        .hero-slide.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* 퇴장하는 슬라이드 (좌측으로 디졸브) */
        .hero-slide.prev-out {
            opacity: 0;
            transform: translateX(-80px);
        }

        .slide-title {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        .slide-desc {
            font-size: 1.2rem;
            line-height: 1.6;
            text-align: center;
            max-width: 600px;
            color: #666;
        }

        /* 하단 서비스 인디케이터 */
        .nav-dots {
            position: absolute;
            bottom: 10%;
            display: flex;
            gap: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ccc;
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            background: var(--point-orange);
            transform: scale(1.3);
        }
    </style>
</head>
<body>

<div class="universe-container">
    <div class="hero-slider">
        <!-- 5대 서비스 슬라이드 -->
        <div class="hero-slide active" data-index="0">
            <h1 class="slide-title">CORE</h1>
            <p class="slide-desc">아이디어의 본질을 정렬하고 AI 프롬프트를 교정하여 브랜드의 뿌리를 설계합니다.</p>
        </div>
        <div class="hero-slide" data-index="1">
            <h1 class="slide-title">LOGO</h1>
            <p class="slide-desc">설계된 가치를 시각적 벡터 자산으로 전환하여 확장 가능한 심볼을 구축합니다.</p>
        </div>
        <div class="hero-slide" data-index="2">
            <h1 class="slide-title">PDF</h1>
            <p class="slide-desc">오차 없는 도면과 기술 설계를 통해 인쇄 공정의 완벽한 결과물을 보장합니다.</p>
        </div>
        <div class="hero-slide" data-index="3">
            <h1 class="slide-title">MOTION</h1>
            <p class="slide-desc">브랜드 자산에 생동감을 불어넣어 무빙 에셋과 영상 가이드를 제작합니다.</p>
        </div>
        <div class="hero-slide" data-index="4">
            <h1 class="slide-title">AGENCY</h1>
            <p class="slide-desc">브랜드의 페르소나를 대행하여 파트너십과 운영을 효율적으로 관리합니다.</p>
        </div>
    </div>

    <div class="nav-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</div>

<script>
    let currentIndex = 0;
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('.dot');

    function updateSlider(nextIndex) {
        const prevIndex = currentIndex;
        
        // 기존 활성 슬라이드 퇴장 처리
        slides[prevIndex].classList.remove('active');
        slides[prevIndex].classList.add('prev-out');
        dots[prevIndex].classList.remove('active');

        // 새 슬라이드 등장 처리
        currentIndex = nextIndex;
        slides[currentIndex].classList.remove('prev-out');
        slides[currentIndex].classList.add('active');
        dots[currentIndex].classList.add('active');

        // 퇴장 애니메이션 완료 후 클래스 정리
        setTimeout(() => {
            slides.forEach((s, i) => {
                if (i !== currentIndex) s.classList.remove('prev-out');
            });
        }, 1200);
    }

    function autoPlay() {
        let next = (currentIndex + 1) % slides.length;
        updateSlider(next);
    }

    // 4초마다 자동 전환 (스테이 시간 확보)
    setInterval(autoPlay, 4000);
</script>

</body>
</html>

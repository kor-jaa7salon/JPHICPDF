<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPHIC UNIVERSE - AI 픽셀벡터 무료진단</title>
    <!-- 디자인 라이브러리 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #030712; 
            color: white; 
            margin: 0; 
            overflow-x: hidden;
        }
        .grid-bg {
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
        }
        .accent-text { color: #00BBAC; }
        .accent-bg { background-color: #00BBAC; }
        input:focus { border-color: #00BBAC !important; outline: none; }
        .selected-card { 
            border-color: #00BBAC !important; 
            background-color: rgba(0, 187, 172, 0.1) !important; 
        }
    </style>
</head>
<body class="selection:bg-[#00BBAC]/30">
    <!-- 배경 그리드 디자인 -->
    <div class="fixed inset-0 pointer-events-none opacity-[0.03] z-0 grid-bg"></div>

    <!-- 상단 네비게이션 바 -->
    <nav class="fixed top-0 w-full h-16 px-6 flex justify-between items-center z-[100] bg-[#030712]/80 backdrop-blur-md border-b border-white/[0.05]">
        <div class="text-lg font-[900] tracking-tighter uppercase">JPHIC UNIVERSE</div>
    </nav>

    <main class="max-w-xl mx-auto px-6 pt-32 relative z-10 pb-40">
        <!-- 헤더 섹션 -->
        <section class="mb-16">
            <div class="inline-flex items-center gap-2 bg-[#00BBAC]/10 text-[#00BBAC] px-3 py-1 rounded-full border border-[#00BBAC]/20 mb-6">
                <span class="text-[11px] font-black uppercase tracking-widest font-mono">Free Diagnosis</span>
            </div>
            <h1 class="text-4xl sm:text-5xl font-[900] leading-[1.15] tracking-tight mb-6">
                AI 이미지를<br/>
                <span class="text-white/40">완벽한 자산으로.</span>
            </h1>
            <p class="text-zinc-500 text-lg leading-relaxed font-medium">
                이미지를 무한 확대 가능한 벡터로 변환하기 전,<br/>
                변환 가능 여부를 무료로 점검해 드립니다.
            </p>
        </section>

        <!-- 01: 로고 유형 선택 영역 -->
        <section class="mb-12">
            <div class="flex items-center gap-3 border-b border-white/[0.1] pb-4 mb-8">
                <span class="text-[11px] font-black accent-text tracking-widest uppercase font-mono">01</span>
                <h3 class="text-lg font-bold">로고 형태 선택</h3>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="type-grid">
                <!-- 자바스크립트로 버튼 자동 생성 -->
            </div>
        </section>

        <!-- 02: 신청 정보 입력 영역 -->
        <section class="mb-12">
            <div class="flex items-center gap-3 border-b border-white/[0.1] pb-4 mb-8">
                <span class="text-[11px] font-black accent-text tracking-widest uppercase font-mono">02</span>
                <h3 class="text-lg font-bold">신청 정보 입력</h3>
            </div>
            <div class="space-y-4">
                <input type="text" id="userName" placeholder="성함 또는 기업명" class="w-full bg-white/[0.03] border border-white/[0.1] rounded-xl py-5 px-6 text-white text-[15px] transition-all">
                <input type="tel" id="userPhone" placeholder="연락처 (- 없이 숫자만)" class="w-full bg-white/[0.03] border border-white/[0.1] rounded-xl py-5 px-6 text-white text-[15px] transition-all">
                <input type="email" id="userEmail" placeholder="결과를 받으실 이메일 주소" class="w-full bg-white/[0.03] border border-white/[0.1] rounded-xl py-5 px-6 text-white text-[15px] transition-all">
                
                <label class="flex items-center gap-4 p-5 bg-white/[0.02] border border-white/[0.05] rounded-2xl cursor-pointer hover:bg-white/[0.05] transition-all">
                    <input type="checkbox" id="agreePrivacy" class="w-5 h-5 accent-[#00BBAC]">
                    <span class="text-[13px] text-zinc-400 font-medium leading-tight">개인정보 수집 및 이용에 동의합니다 (필수)</span>
                </label>
            </div>
        </section>

        <!-- 버튼/결과 영역 -->
        <div id="action-area">
            <button onclick="handleSubmit()" id="submit-btn" class="w-full py-6 bg-white text-black rounded-2xl font-[900] text-[16px] flex items-center justify-center gap-2 hover:bg-[#00BBAC] hover:text-white transition-all shadow-xl active:scale-[0.98]">
                무료 진단 신청하기 (0원)
            </button>
        </div>
    </main>

    <script>
        // --- 설정: 제공해주신 최신 구글 앱스 스크립트 주소 적용 ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyAo2gS8yYWEUkNxkqSzlv6fOAZz0DRp3hepY2789Rz73khuHyr3uiAj_KqCcInlPC3/exec";
        const OPEN_CHAT_URL = "https://open.kakao.com/o/s154Q5ui";
        
        let selectedType = "";
        const logoTypes = [
            { name: '워드마크형', desc: '텍스트 중심의 깔끔한 로고' },
            { name: '심볼형', desc: '아이콘/그래픽 중심 로고' },
            { name: '엠블럼형', desc: '도형과 글자가 결합된 로고' },
            { name: '캐릭터형', desc: '마스코트 기반 일러스트 로고' }
        ];

        // 페이지 초기화
        window.onload = () => {
            const grid = document.getElementById('type-grid');
            logoTypes.forEach((t, index) => {
                const btn = document.createElement('button');
                btn.id = 'type-' + index;
                btn.className = "p-5 rounded-2xl border border-white/10 bg-white/[0.02] text-left transition-all hover:border-white/30";
                btn.onclick = () => {
                    selectedType = t.name;
                    document.querySelectorAll('#type-grid button').forEach(b => b.classList.remove('selected-card'));
                    btn.classList.add('selected-card');
                };
                btn.innerHTML = `<h4 class="font-bold text-white mb-1">${t.name}</h4><p class="text-[12px] text-zinc-500">${t.desc}</p>`;
                grid.appendChild(btn);
            });
        };

        // 데이터 전송 처리
        async function handleSubmit() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const email = document.getElementById('userEmail').value;
            const agree = document.getElementById('agreePrivacy').checked;

            if(!name || !phone || !email || !agree || !selectedType) {
                alert("모든 빈칸을 채우고 유형을 선택해 주세요.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "데이터 전송 중...";
            btn.disabled = true;

            // 구글 앱스 스크립트로 보낼 데이터 파라미터 구성
            const params = new URLSearchParams({
                userName: name,
                userPhone: phone,
                userEmail: email,
                logoType: selectedType,
                timestamp: new Date().toLocaleString('ko-KR'),
                difficulty: '1.0',
                price: '0',
                source: 'Blog_Promotion_Free'
            });

            try {
                // 데이터 전송
                await fetch(SCRIPT_URL + "?" + params.toString(), {
                    method: 'POST',
                    mode: 'no-cors'
                });
                
                // 성공 시 화면 전환
                document.getElementById('action-area').innerHTML = `
                    <div class="bg-white/5 border border-[#00BBAC]/30 p-8 rounded-3xl text-center space-y-6">
                        <div class="text-[#00BBAC] font-black text-xl">신청이 접수되었습니다!</div>
                        <p class="text-zinc-400 text-sm">마지막 단계: 아래 버튼을 눌러 오픈챗으로<br/>진단받을 AI 생성 이미지를 보내주세요.</p>
                        <a href="${OPEN_CHAT_URL}" target="_blank" class="block w-full py-5 bg-[#00BBAC] text-black font-black rounded-xl hover:bg-[#00d4c3] transition-all">카카오톡으로 이미지 보내기</a>
                    </div>
                `;
            } catch (e) {
                console.error(e);
                alert("전송 중 오류가 발생했습니다. 구글 앱스 스크립트 설정을 다시 확인해 주세요.");
                btn.innerText = "무료 진단 신청하기 (0원)";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>

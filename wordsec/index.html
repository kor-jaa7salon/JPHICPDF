<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>단어장 홈</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
:root{ --bg:#F3F1ED; --ink:#161616; --sub:#7A766E; --card:#FFFFFF; --accent:#6D5AE0; --track:#D8D3C8; }
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; background:var(--bg); font-family:'Pretendard',sans-serif; color:var(--ink); overflow:hidden;}
#app{position:fixed; inset:0; max-width:480px; margin:0 auto; display:flex; flex-direction:column; padding:26px;}

.topline{text-align:center; font-size:14px; color:var(--sub); margin-bottom:26px;}

#stackWrap{position:relative; flex:0 0 320px;}
.arrow{position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%;
  background:var(--card); border:1px solid var(--track); color:var(--sub); font-size:16px; z-index:50;}
.arrow.left{left:-6px;} .arrow.right{right:-6px;}

.card{position:absolute; top:50%; left:50%; width:220px; height:280px; margin:-140px 0 0 -110px;
  background:var(--card); border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,.12);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
  touch-action:pan-y; will-change:transform;}
.card .code{position:absolute; top:20px; left:22px; font-size:12px; color:var(--sub); letter-spacing:.05em;}
.card .code::after{content:''; display:block; width:24px; height:1px; background:var(--track); margin-top:6px;}
.card .word{font-size:34px; font-weight:900;}
.card .tap{position:absolute; bottom:24px; font-size:11px; color:var(--sub); letter-spacing:.1em; opacity:0; transition:opacity .3s;}
.card.front .tap{opacity:1;}

#thumbClip{overflow:hidden; padding:18px 4px 22px;}
#thumbs{display:flex; gap:10px; transition:transform .4s cubic-bezier(.34,1.2,.4,1); width:max-content;}
.thumb{flex:0 0 auto; width:64px; height:64px; border-radius:14px; background:var(--card); border:2px solid transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; color:var(--sub); font-weight:700;
  transition:border-color .25s;}
.thumb .tword{font-size:12px; color:var(--ink); font-weight:800; margin-top:2px;}
.thumb.on{border-color:var(--accent);}

#pasteBox{margin-top:auto; background:var(--card); border:1px solid var(--track); border-radius:18px; padding:16px;}
#pasteBox textarea{width:100%; height:70px; border:none; resize:none; font-family:inherit; font-size:13px; color:var(--ink); background:transparent;}
#pasteBox textarea::placeholder{color:var(--sub);}
#pasteRow{display:flex; justify-content:flex-end;}
#pasteSubmit{width:34px; height:34px; border-radius:50%; background:var(--track); border:none; color:var(--ink); font-size:15px;}
#pasteSubmit.ready{background:var(--accent); color:#fff;}

#flipLayer{position:fixed; z-index:200; background:var(--card); border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,.2);
  transition:all .38s cubic-bezier(.3,.9,.35,1); display:none; overflow:hidden;}
</style>
</head>
<body>
<div id="app">
  <div class="topline">슬라이드해서 두번째 뜻 모르는 세트 찾기</div>
  <div id="stackWrap">
    <button class="arrow left" id="arrL">←</button>
    <div id="cards"></div>
    <button class="arrow right" id="arrR">→</button>
  </div>
  <div id="thumbClip"><div id="thumbs"></div></div>
  <div id="pasteBox">
    <textarea id="pasteInput" placeholder="여기에 붙여넣기 (영어,뜻 한 줄씩)"></textarea>
    <div id="pasteRow"><button id="pasteSubmit">↑</button></div>
  </div>
</div>
<div id="flipLayer"></div>

<script>
/* ---------- 세트 데이터 (로컬 저장, 로그인 없음) ---------- */
const LS_SETS='voca_home_sets';
function lj(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sj(k,v){localStorage.setItem(k, JSON.stringify(v));}

let sets = lj(LS_SETS, [
  {code:'A0901', word:'novel', count:15},
  {code:'A0902', word:'approach', count:12},
  {code:'A0903', word:'object', count:15},
  {code:'A0904', word:'fine', count:10},
  {code:'A0905', word:'contract', count:14},
]);
sj(LS_SETS, sets);

let activeIndex = 0; // 단일 상태(Single Source of Truth)
const cardsEl = document.getElementById('cards');
const thumbsEl = document.getElementById('thumbs');
const THUMB_W = 64+10; // width+gap

/* ---------- 카드: DOM 1회 생성, transform만 갱신 ---------- */
function buildCards(){
  cardsEl.innerHTML = sets.map((s,i)=>`
    <div class="card" id="card-${i}" data-i="${i}">
      <div class="code">#${s.code}</div>
      <div class="word">${s.word}</div>
      <div class="tap">tap</div>
    </div>`).join('');
  sets.forEach((s,i)=>{
    const el = document.getElementById('card-'+i);
    el.onclick = ()=> { if((( i-activeIndex+sets.length)%sets.length)===0) flipEnter(el, s); };
    attachSwipe(el);
  });
}
function layoutCards(){
  const len = sets.length;
  sets.forEach((s,i)=>{
    const el = document.getElementById('card-'+i);
    if(!el) return;
    let diff = (i - activeIndex + len) % len; // 0,1,2,3...
    el.classList.toggle('front', diff===0);
    if(diff===0){ el.style.transform=`translateY(0) scale(1)`; el.style.zIndex=10; el.style.opacity=1; }
    else if(diff===1){ el.style.transform=`translateY(15px) scale(.95)`; el.style.zIndex=9; el.style.opacity=1; }
    else if(diff===2){ el.style.transform=`translateY(30px) scale(.90)`; el.style.zIndex=8; el.style.opacity=1; }
    else if(diff===len-1){ el.style.transform=`translateX(-30px) translateY(10px) scale(.9)`; el.style.zIndex=7; el.style.opacity=0; }
    else { el.style.transform=`translateY(40px) scale(.85)`; el.style.zIndex=6; el.style.opacity=0; }
  });
}
function buildThumbs(){
  thumbsEl.innerHTML = sets.map((s,i)=>`
    <div class="thumb" id="thumb-${i}" data-i="${i}">
      <div>#${s.code.slice(-3)}</div><div class="tword">${s.word}</div>
    </div>`).join('');
  thumbsEl.querySelectorAll('.thumb').forEach(t=>{
    t.onclick=()=>{ activeIndex=+t.dataset.i; syncAll(); };
  });
}
function layoutThumbs(){
  sets.forEach((_,i)=> document.getElementById('thumb-'+i).classList.toggle('on', i===activeIndex));
  const clipW = document.getElementById('thumbClip').clientWidth;
  const offset = Math.max(0, activeIndex*THUMB_W - clipW/2 + THUMB_W/2);
  thumbsEl.style.transform = `translateX(${-offset}px)`;
}
function syncAll(){ layoutCards(); layoutThumbs(); } // activeIndex 하나로 카드+썸네일 동기화

function next(){ activeIndex=(activeIndex+1)%sets.length; syncAll(); }
function prev(){ activeIndex=(activeIndex-1+sets.length)%sets.length; syncAll(); }
document.getElementById('arrR').onclick=next;
document.getElementById('arrL').onclick=prev;

function attachSwipe(el){
  let sx=0, sy=0, lx=0, ly=0, drag=false;
  el.addEventListener('pointerdown', e=>{ drag=true; sx=e.clientX; sy=e.clientY; lx=sx; ly=sy; });
  el.addEventListener('pointermove', e=>{ if(drag){ lx=e.clientX; ly=e.clientY; } });
  function end(){
    if(!drag) return; drag=false;
    const dx=lx-sx, dy=ly-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ dx<0 ? next() : prev(); }
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ---------- 탭 모션: FLIP(공유요소 전환) 근사 ---------- */
function flipEnter(cardEl, s){
  const r = cardEl.getBoundingClientRect();
  const layer = document.getElementById('flipLayer');
  layer.style.display='block';
  layer.style.top=r.top+'px'; layer.style.left=r.left+'px';
  layer.style.width=r.width+'px'; layer.style.height=r.height+'px';
  layer.style.transition='none';
  void layer.offsetWidth;
  layer.style.transition='all .38s cubic-bezier(.3,.9,.35,1)';
  requestAnimationFrame(()=>{
    layer.style.top='0px'; layer.style.left='0px';
    layer.style.width='100vw'; layer.style.height='100vh';
    layer.style.borderRadius='0px';
  });
  setTimeout(()=>{ location.href = 'voca-reels.html?set=' + encodeURIComponent(s.code); }, 380);
}

/* ---------- 붙여넣기로 세트 생성: SET:코드 + en,meaning ---------- */
const pasteInput = document.getElementById('pasteInput');
const pasteSubmit = document.getElementById('pasteSubmit');
pasteInput.addEventListener('input', ()=> pasteSubmit.classList.toggle('ready', pasteInput.value.trim().length>0));
pasteSubmit.onclick = ()=>{
  const txt = pasteInput.value.trim(); if(!txt) return;
  const lines = txt.split('\n').map(l=>l.trim()).filter(Boolean);
  let wordLines = lines;
  if(/^SET:/i.test(lines[0])) wordLines = lines.slice(1); // 코드 줄 있으면 무시(자동생성 우선)
  const parsed = wordLines.map(l=>{ const [en,meaning]=l.split(','); return {en:(en||'').trim(), meaning:(meaning||'').trim()}; })
    .filter(w=>w.en);
  if(!parsed.length){ alert('형식 확인: 한 줄에 "영어,뜻"'); return; }
  const code = 'S' + Date.now().toString().slice(-5);
  sets.push({code, word: parsed[0].en, count: parsed.length, words: parsed});
  sj(LS_SETS, sets);
  pasteInput.value=''; pasteSubmit.classList.remove('ready');
  buildCards(); buildThumbs();
  activeIndex = sets.length-1; syncAll();
};

buildCards(); buildThumbs(); syncAll();
</script>
</body>
</html>

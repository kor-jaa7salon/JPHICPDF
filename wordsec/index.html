<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base href="/wordsec/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>단어장 홈</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
:root{ --bg:#F3F1ED; --ink:#161616; --sub:#7A766E; --card:#FFFFFF; --accent:#161616; --track:#D8D3C8; }
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100dvh; background:var(--bg); font-family:'Pretendard',sans-serif; color:var(--ink); overflow:hidden; overscroll-behavior:none;}
#app{position:fixed; inset:0; max-width:480px; margin:0 auto; display:flex; flex-direction:column; justify-content:center; padding:26px;}

.topline{text-align:center; font-size:13px; color:var(--sub); margin-bottom:20px;}
#csBtnHome{position:fixed; top:16px; right:16px; z-index:60; width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--track); color:var(--sub); font-size:15px;}
.selRow{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:24px;}
.selLabel{font-size:14px; font-weight:600;}
.sel{display:flex; align-items:center; gap:6px; font-size:20px; font-weight:700; cursor:pointer; padding:4px 10px; border-radius:10px;}
.sel:active{background:var(--card);}
.sel i{font-style:normal; font-size:14px; color:var(--sub);}
#pickerLayer{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center;}
#pickerLayer.picker-hidden{display:none;}
.picker{background:var(--card); border-radius:20px; max-height:60vh; overflow-y:auto; width:120px; box-shadow:0 20px 50px rgba(0,0,0,.25); padding:6px;}
.picker div{padding:14px; text-align:center; font-size:20px; font-weight:700; border-radius:12px; cursor:pointer;}
.picker div.on{background:var(--ink); color:#fff;}

#stackWrap{position:relative; flex:1 1 auto; min-height:320px;}
.arrow{position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%;
  background:var(--card); border:1px solid var(--track); color:var(--sub); font-size:16px; z-index:50;}
.arrow.left{left:-6px;} .arrow.right{right:-6px;}

.card{position:absolute; top:50%; left:50%; width:220px; height:280px; margin:-140px 0 0 -110px;
  background:var(--card); border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,.12);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:transform .42s cubic-bezier(.32,.9,.35,1), opacity .42s cubic-bezier(.32,.9,.35,1);
  touch-action:pan-y; will-change:transform;}
.card .code{position:absolute; top:20px; left:22px; font-size:12px; color:var(--sub); letter-spacing:.05em;}
.card .code::after{content:''; display:block; width:24px; height:1px; background:var(--track); margin-top:6px;}
.card .word{font-size:34px; font-weight:900;}
.card .title{font-size:19px; font-weight:900; text-align:center; line-height:1.35; padding:0 18px; word-break:keep-all;}
.card .wordSub{font-size:12px; color:var(--sub); margin-top:10px;}
.card .tap{position:absolute; bottom:24px; font-size:11px; color:var(--sub); letter-spacing:.1em; opacity:0; transition:opacity .3s;}
.card.front .tap{opacity:1;}
.card .cardShare{position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:50%;
  background:var(--bg); border:1px solid var(--track); color:var(--sub); font-size:13px; display:none; align-items:center; justify-content:center;}
.card.front .cardShare{display:flex;}

#pasteBox{margin-top:auto; background:var(--card); border:1px solid var(--track); border-radius:18px; padding:16px;}
#pasteBox textarea{width:100%; height:70px; border:none; resize:none; font-family:inherit; font-size:13px; color:var(--ink); background:transparent;}
#pasteBox textarea::placeholder{color:var(--sub);}
#pasteRow{display:flex; justify-content:flex-end;}
#pasteSubmit{width:34px; height:34px; border-radius:50%; background:var(--track); border:none; color:var(--ink); font-size:15px;}
#pasteSubmit.ready{background:var(--accent); color:#fff;}

#flipLayer{position:fixed; z-index:200; background:var(--card); border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,.2);
  transition:all .38s cubic-bezier(.3,.9,.35,1); display:none; overflow:hidden;}
</style>
</head>
<body>
<button id="csBtnHome">?</button>
<div id="app">
  <div class="topline" id="notice">지금은 A단계만 있어. 너와 내가 같이 성장할거야.</div>
  <div class="selRow">
    <span class="selLabel">Step</span>
    <div class="sel" id="selStep"><span id="stepVal">A</span> <i>⌄</i></div>
    <div class="sel" id="selMon"><span id="monVal">07</span> <i>⌄</i></div>
  </div>
  <div id="stackWrap">
    <button class="arrow left" id="arrL">←</button>
    <div id="cards"></div>
    <button class="arrow right" id="arrR">→</button>
  </div>
</div>
<div id="pickerLayer" class="picker-hidden">
  <div class="picker" id="pickerBody"></div>
</div>
<div id="flipLayer"></div>

<script>
/* ---------- 세트 데이터: sets/index.json 자동 로드 ---------- */
let allSets = [];   // 전체
let sets = [];      // 현재 필터된 세트
let activeIndex = 0;
let curStep='A', curMon=String(new Date().getMonth()+1).padStart(2,'0');
const cardsEl = document.getElementById('cards');

async function loadSets(){
  try{
    const r = await fetch('./sets/index.json', {cache:'no-store'});
    allSets = await r.json();
  }catch(e){ allSets = []; }
  document.getElementById('stepVal').textContent=curStep;
  document.getElementById('monVal').textContent=curMon;
  applyFilter();
}
function applyFilter(){
  // 코드 규칙: {Step}{MMDD} → 앞1자=step, 다음2자=MM
  sets = allSets.filter(s=> s.code[0]===curStep && s.code.slice(1,3)===curMon);
  activeIndex = 0;
  if(!sets.length){ cardsEl.innerHTML='<p style="text-align:center;opacity:.5;padding:40px 0">이 단계·월 세트 없음</p>'; return; }
  buildCards(); syncAll();
}

/* ---------- Step/MM 드롭다운 ---------- */
const STEPS=['A','B','C','D','E','F'];
const MONS=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));
function openPicker(list, cur, cb){
  const layer=document.getElementById('pickerLayer'), body=document.getElementById('pickerBody');
  body.innerHTML=list.map(v=>`<div class="${v===cur?'on':''}" data-v="${v}">${v}</div>`).join('');
  layer.classList.remove('picker-hidden');
  body.querySelectorAll('div').forEach(d=> d.onclick=()=>{ cb(d.dataset.v); layer.classList.add('picker-hidden'); });
}
document.getElementById('pickerLayer').onclick=e=>{ if(e.target.id==='pickerLayer') e.currentTarget.classList.add('picker-hidden'); };
document.getElementById('selStep').onclick=()=>openPicker(STEPS,curStep,v=>{ curStep=v; document.getElementById('stepVal').textContent=v; applyFilter(); });
document.getElementById('selMon').onclick=()=>openPicker(MONS,curMon,v=>{ curMon=v; document.getElementById('monVal').textContent=v; applyFilter(); });
document.getElementById('csBtnHome').onclick=()=>location.href='./cs.html';

/* ---------- 카드: DOM 1회 생성, transform만 갱신 ---------- */
function buildCards(){
  cardsEl.innerHTML = sets.map((s,i)=>`
    <div class="card" id="card-${i}" data-i="${i}">
      <button class="cardShare" data-share="${i}">🔗</button>
      <div class="code">#${s.code}</div>
		<div class="title">${s.title}</div>
		<div class="wordSub">대표어 ${s.word} · ${s.count}단어</div>
      <div class="tap">tap</div>
    </div>`).join('');
  sets.forEach((s,i)=>{
    const el = document.getElementById('card-'+i);
    el.onclick = (e)=> {
      if(e.target.closest('.cardShare')){ shareSet(s); return; }
      if((( i-activeIndex+sets.length)%sets.length)===0) flipEnter(el, s);
    };
    attachSwipe(el);
  });
}
function shareSet(s){
  const url = 'https://www.jphic.co.kr/wordsec';
  const data = {title:'단어장', text:`${s.word} 세트 (#${s.code})`, url};
  if(navigator.share){ navigator.share(data).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>alert('링크 복사됨')).catch(()=>prompt('링크', url)); }
  else { prompt('링크', url); }
}
function layoutCards(){
  const len = sets.length;
  sets.forEach((s,i)=>{
    const el = document.getElementById('card-'+i);
    if(!el) return;
    let diff = (i - activeIndex + len) % len; // 0=center,1..=대기(오른쪽),len-1=예비(왼쪽)
    el.classList.toggle('front', diff===0);
    if(diff===0){ el.style.transform=`translateX(0) scale(1)`; el.style.zIndex=10; el.style.opacity=1; }
    else if(diff===1){ el.style.transform=`translateX(40px) scale(.92)`; el.style.zIndex=9; el.style.opacity=.85; }
    else if(diff===2){ el.style.transform=`translateX(70px) scale(.85)`; el.style.zIndex=8; el.style.opacity=.5; }
    else if(diff===len-1){ el.style.transform=`translateX(-260px) scale(.85)`; el.style.zIndex=7; el.style.opacity=0; }
    else { el.style.transform=`translateX(100px) scale(.8)`; el.style.zIndex=6; el.style.opacity=0; }
  });
}
function syncAll(){ layoutCards(); }

function next(){ activeIndex=(activeIndex+1)%sets.length; syncAll(); }
function prev(){ activeIndex=(activeIndex-1+sets.length)%sets.length; syncAll(); }
document.getElementById('arrR').onclick=next;
document.getElementById('arrL').onclick=prev;

function attachSwipe(el){
  let sx=0, sy=0, lx=0, ly=0, drag=false;
  el.addEventListener('pointerdown', e=>{ drag=true; sx=e.clientX; sy=e.clientY; lx=sx; ly=sy; });
  el.addEventListener('pointermove', e=>{ if(drag){ lx=e.clientX; ly=e.clientY; } });
  function end(){
    if(!drag) return; drag=false;
    const dx=lx-sx, dy=ly-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ dx<0 ? next() : prev(); }
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ---------- 세트 진입: 홈 왼쪽 가속 퇴장 ---------- */
function flipEnter(cardEl, s){
  const app = document.getElementById('app');
  app.style.transition = 'transform .42s cubic-bezier(.5,0,.75,0), opacity .42s ease'; // ease-in(가속)
  app.style.transform = 'translateX(-40%)';
  app.style.opacity = '0';
  setTimeout(()=>{ location.href = './voca-reels.html?set=' + encodeURIComponent(s.code) + '&from=home'; }, 400);
}

loadSets();
</script>
</body>
</html>

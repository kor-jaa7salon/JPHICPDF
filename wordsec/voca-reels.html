<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>단어장</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=DM+Serif+Display&family=Bebas+Neue&family=Caveat:wght@700&family=Space+Grotesk:wght@700&display=swap');

:root{
  --bg:#F3F1ED; --ink:#161616; --sub:#7A766E; --card:#FFFFFF;
  --accent:#6D5AE0; --track:#D8D3C8; --gold:#B98900;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
html,body{height:100%; overflow:hidden; background:var(--bg); font-family:'Pretendard',sans-serif; color:var(--ink);}
#app{position:fixed; inset:0; max-width:480px; margin:0 auto; background:var(--bg);}

#topRight{position:fixed; top:14px; right:14px; z-index:60; display:flex; gap:8px;}
#topRight button{width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--track); color:var(--ink); font-size:14px;}

#dots{position:fixed; right:8px; top:50%; transform:translateY(-50%); z-index:55; display:flex; flex-direction:column; gap:6px;}
.dot{width:5px; height:5px; border-radius:50%; background:var(--track);}
.dot.on{background:var(--accent); height:16px; border-radius:4px;}

#reels{height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; scroll-behavior:smooth; -webkit-overflow-scrolling:touch;}
#reels::-webkit-scrollbar{display:none;}
.slide{height:100%; scroll-snap-align:start; scroll-snap-stop:always; position:relative; display:flex; flex-direction:column;
  justify-content:center; align-items:center; overflow:hidden; padding:26px; touch-action:pan-y;
  background:var(--bg); color:var(--ink); transition:background .3s, color .3s;}
.slide.dark-local{
  --bg:#16193e; --ink:#F5F3F7; --sub:#8B8896; --card:#16151F; --track:#26232E;
}

.hook{text-align:center; font-size:16px; font-weight:600; line-height:1.5; margin-bottom:6px; max-width:300px;}
.hintline{font-size:13px; color:var(--sub); margin-bottom:18px; letter-spacing:.02em; line-height:1.5; max-width:280px; text-align:center;}

.swipeHint{position:absolute; left:16px; bottom:120px; display:flex; flex-direction:column;
  align-items:center; gap:4px; font-size:11px; color:var(--sub);}
.pullHint{display:flex; flex-direction:column;
  align-items:center; gap:4px; font-size:11px; color:var(--sub); margin-top:40px;}
.primaryTag{font-size:13px; color:var(--sub); margin-top:8px;}

.morphbox{position:relative; height:190px; width:100%; display:flex; align-items:center; justify-content:center; perspective:500px; margin:14px 0;}
.mtext{font-size:52px; font-weight:800; text-align:center; white-space:nowrap; line-height:1.3;}
.mtext.ko{font-size:30px; font-weight:400;}
.mtext .cw{display:inline-block; will-change:transform,opacity,filter;}


@keyframes cwWave{from{opacity:0; transform:translateY(7px) scale(.85);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes cwSkate{from{opacity:0; transform:translate(14px,3px) skewX(-10deg);} to{opacity:1; transform:translate(0,0) skewX(0);}}
@keyframes cwFlip{from{opacity:0; transform:rotateX(85deg);} to{opacity:1; transform:rotateX(0);}}
@keyframes cwFade{from{opacity:0;} to{opacity:1;}}
@keyframes cwBeat{0%{opacity:0; transform:scale(.6);} 40%{opacity:1; transform:scale(1.3);} 60%{transform:scale(.92);} 80%{transform:scale(1.12);} 100%{transform:scale(1);}}
.cw-wave{animation:cwWave .35s ease-out forwards;}
.cw-skate{animation:cwSkate .3s ease-out forwards;}
.cw-flip{animation:cwFlip .3s ease-out forwards;}
.cw-fade{animation:cwFade .25s ease-out forwards;}
.cw-beat{animation:cwBeat .5s cubic-bezier(.3,1.6,.4,1) forwards;}

.blk-blur{filter:blur(8px); opacity:0; transition:filter .4s ease, opacity .4s ease;}
.blk-blur.on{filter:blur(0); opacity:1;}
.blk-smooth{filter:blur(3px); opacity:0; transform:scale(1.02); transition:filter .55s ease, opacity .55s ease, transform .55s ease;}
.blk-smooth.on{filter:blur(0); opacity:1; transform:scale(1);}
.blk-spacing{letter-spacing:-6px; opacity:.35; transition:letter-spacing .5s ease, opacity .5s ease;}
.blk-spacing.on{letter-spacing:normal; opacity:1;}

.exit-up{animation:exU .22s ease-in forwards;} .exit-down{animation:exD .22s ease-in forwards;}
.exit-left{animation:exL .22s ease-in forwards;} .exit-right{animation:exR .22s ease-in forwards;}
@keyframes exU{to{opacity:0; transform:translateY(-14px);}}
@keyframes exD{to{opacity:0; transform:translateY(14px);}}
@keyframes exL{to{opacity:0; transform:translateX(-14px);}}
@keyframes exR{to{opacity:0; transform:translateX(14px);}}

.darkToggle{position:relative; width:101px; height:45px; border-radius:999px; border:none;
  background:#8ECBEE; margin-top:20px; padding:0; transition:background 1s;}
.darkToggle.dark{background:#282f59;}
.darkToggle .knob{position:absolute; top:4px; left:4px; width:37px; height:37px; border-radius:50%;
  background:#FFD400; font-size:18px; display:flex; align-items:center; justify-content:center;
  transition:left 1s cubic-bezier(.34,1.56,.64,1); box-shadow:0 2px 8px rgba(0,0,0,.2);}
.darkToggle.dark .knob{left:60px;}
@keyframes knobSpin{from{transform:rotate(0deg) scale(1);} to{transform:rotate(360deg) scale(1);}}
@keyframes knobLand{0%{transform:scale(1);} 45%{transform:scale(1.18);} 100%{transform:scale(1);}}
.darkToggle .knob.spinning{animation:knobSpin 1s linear;}
.darkToggle .knob.land{animation:knobLand .3s ease-out;}
.darkToggle .label{position:absolute; top:50%; transform:translateY(-50%); font-size:13px; color:#fff; text-align:center;
  opacity:0; transition:opacity .35s ease; pointer-events:none;}
.darkToggle .label.show{opacity:1;}
.darkToggle .label.r{left:41px; width:52px; font-weight:800;}
.darkToggle .label.l{left:4px; width:52px; font-weight:400;}

#exampleView{position:fixed; inset:0; z-index:65; background:#16193e; color:#fff; padding:26px;
  transform:translateX(100%); transition:transform .35s ease; display:flex; flex-direction:column;}
#exampleView.show{transform:translateX(0);}
#exBack{align-self:flex-start; color:rgba(255,255,255,.55); font-size:13px; margin-bottom:36px;}
.exDots{display:flex; gap:5px; align-self:center; margin-bottom:6px;}
.exDots i{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.25);}
.exDots i.on{background:#fff;}
.exBody{flex:1; display:flex; flex-direction:column; justify-content:center;}
.exEn{font-size:22px; line-height:1.6; font-family:'Georgia',serif;}
.exDivider{height:1px; background:#5e6791; margin:30px 0; opacity:.6;}
.exKo{font-size:15px; line-height:1.7; color:rgba(255,255,255,.8);}
@keyframes hlDraw{0%{background-size:0% 60%; transform:skewX(0deg);} 60%{transform:skewX(-2deg);} 100%{background-size:100% 60%; transform:skewX(0deg);}}
.hl{background-image:linear-gradient(#9C8CFF,#9C8CFF); background-repeat:no-repeat; background-size:0% 60%;
  background-position:0 88%; padding:0 1px; display:inline-block;}
.hl.draw{animation:hlDraw .5s ease-out forwards;}

.center-screen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:30px; text-align:center; gap:16px; background:var(--bg);}
.center-screen h2{font-size:19px; font-weight:400;}
.center-screen p{color:var(--sub); font-size:13px;}
.video-link{background:var(--card); border:2px solid var(--gold); color:var(--gold); padding:13px 24px; border-radius:16px; font-weight:800; text-decoration:none;}
.big-btn{background:var(--accent); color:#fff; border:none; padding:13px 28px; border-radius:16px; font-weight:900; font-size:14px;}
.big-btn:disabled{opacity:.3;}

.spell-wrap{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; background:var(--bg);}
.spell-tag{color:var(--sub); font-size:12px; margin-bottom:10px;}
.spell-card{background:var(--card); border:1px solid var(--track); border-radius:22px; padding:30px 22px; text-align:center; width:100%; max-width:340px;}
.spell-card .ko{font-size:22px; font-weight:400; margin-bottom:16px;}
.spell-card input{width:100%; background:var(--bg); border:2px solid var(--track); border-radius:14px; color:var(--ink); padding:14px; font-size:18px; text-align:center; font-weight:700;}
.spell-card input.correct{border-color:#18B37A;}
.spell-card input.incorrect{border-color:#E23A5D;}
.spell-card .answer{margin-top:8px; color:#E23A5D; font-size:13px;}
.spell-card button{margin-top:16px; background:var(--accent); color:#fff; border:none; padding:12px 26px; border-radius:14px; font-weight:900;}
.flash-pop{font-size:12px; color:var(--gold); margin-top:8px; font-weight:800; opacity:0;}
.flash-pop.show{opacity:1;}

#end{position:absolute; inset:0; overflow-y:auto; padding:24px 20px 40px; background:var(--bg);}
#end h2{font-size:19px; font-weight:400; margin-bottom:6px;}
.sub2{color:var(--sub); font-size:13px; margin-bottom:14px;}
.adv-badge{display:inline-block; background:var(--card); color:var(--gold); border:1px solid var(--gold); padding:5px 14px; border-radius:20px; font-size:13px; font-weight:800; margin-bottom:16px;}
.wrong-item{background:var(--card); border:1px solid var(--track); border-radius:16px; padding:14px 16px; margin-bottom:10px;}
.wrong-item .en{font-weight:800; font-size:16px;}
.wrong-item .ko{color:var(--accent); font-size:13px; margin-top:2px; font-weight:400;}
.next-set{background:var(--card); border:1px dashed var(--track); border-radius:16px; padding:16px; margin-top:18px; text-align:center; font-size:13px; color:var(--sub);}
.kakao-btn{margin-top:16px; width:100%; background:#FEE500; color:#111; border:none; padding:14px; border-radius:16px; font-weight:900;}
.share-btn{margin-top:10px; width:100%; background:var(--card); border:1px solid var(--track); color:var(--ink); padding:14px; border-radius:16px; font-weight:800;}
</style>
</head>
<body>
<div id="app">
  <div id="topRight">
    <button id="shareBtn">🔗</button>
    <button id="gear">⚙</button>
  </div>
  <div id="dots"></div>
  <div id="reels"></div>
</div>
<div id="exampleView">
  <span id="exBack">→ 오른쪽 스와이프로 back</span>
  <div class="exDots" id="exDots"></div>
  <div class="exBody">
    <div class="exEn" id="exEnText"></div>
    <div class="exDivider"></div>
    <div class="exKo" id="exKoText"></div>
  </div>
</div>

<script>
/* ---------- 브랜드 헤드카피 ---------- */
const TAGLINES = [
  "첫 뜻은 다 알잖아, 두 번째 뜻은 너만 알아",
  "두 번째 것, 너만 몰랐어",
  "첫사랑은 보내고 두 번째 사랑이 온다"
];
const HINT = "두 번째 뜻은?";

/* ---------- 샘플 시드 ---------- */
const SEED = [
{en:"present", meaning1:"선물, 현재의", meaning:"진술하다, 제기하다", context:`(발표할 때) "PPT 보여줄게!" 할 때 그 제시는 'present'야.`, example:["She will present her findings tomorrow.","The lawyer will present new evidence.","He wants to present a solution to the board."], subject:"영어"},
{en:"novel", meaning1:"소설", meaning:"새로운, 참신한", context:`"이 생각 레알 신상 감인데?" → 완전 참신함!`, example:["This is a truly novel approach to teaching.","The novel method surprised everyone.","Her novel idea impressed the judges."], subject:"영어"},
{en:"content", meaning1:"내용물", meaning:"만족하는", context:`배부르면 텐션 올라가? "Content!"(만족!)`, example:["She seemed perfectly content with the results.","He felt content after finishing the marathon.","They were content just to relax at home."], subject:"영어"},
{en:"object", meaning1:"물건", meaning:"반대하다", context:`"난 반대야(Object)!" 법정 드라마 짤 생각하기.`, example:["I must object to this decision.","She objected strongly to the plan.","The lawyer objected during the trial."], subject:"영어"},
{en:"fine", meaning1:"좋은, 괜찮은", meaning:"벌금", context:`지각해서 낸 벌금. "Fine(좋아)?" 아니, 지갑 털렸어.`, example:["He had to pay a fine for speeding.","The court imposed a heavy fine.","She got a fine for littering."], subject:"영어"},
{en:"minute", meaning1:"분(시간)", meaning:"아주 작은, 사소한", context:`'마이뉴트'라고 읽음! 아주 작은 미세먼지(mini).`, example:["He noticed a minute difference in color.","There was a minute error in the report.","The details were almost too minute to see."], subject:"영어"},
{en:"desert", meaning1:"사막", meaning:"저버리다, 버리다", context:`친구를 사막에 버리고 혼자 도망가면 'desert'.`, example:["He would never desert his friends.","The soldiers refused to desert their post.","She felt he had deserted her in hard times."], subject:"영어"},
{en:"subject", meaning1:"과목", meaning:"~에 영향받기 쉬운", context:`"얘는 감기 걸리기 쉽네(subject to cold)."`, example:["The plan is subject to change.","Prices are subject to review.","The rule is subject to certain exceptions."], subject:"영어"},
{en:"contract", meaning1:"계약", meaning:"(병에) 걸리다", context:`세균이랑 질병이 나랑 계약 맺음. (안 좋은 계약!)`, example:["He contracted a serious illness abroad.","She contracted the flu last winter.","Workers may contract diseases from exposure."], subject:"영어"},
{en:"conduct", meaning1:"행동, 품행", meaning:"지휘하다", context:`오케스트라 지휘자. 음악을 이끄는 'conduct'.`, example:["He will conduct the orchestra tonight.","She conducts research on climate change.","The teacher conducted a small survey."], subject:"영어"},
{en:"table", meaning1:"탁자", meaning:"(안건을) 보류하다", context:`"이건 탁자 위에 올려두고 다음에 하자!" (보류)`, example:["They decided to table the motion.","The committee tabled the proposal.","Let's table this discussion for now."], subject:"영어"},
{en:"bear", meaning1:"곰", meaning:"참다, 견디다", context:`곰처럼 무거운 걸 들고 끙끙 참는 모습 상상.`, example:["I can hardly bear the pain.","She bore the criticism silently.","He couldn't bear to watch."], subject:"영어"},
{en:"produce", meaning1:"생산하다", meaning:"(증거를) 제시하다", context:`경찰이 "증거(evidence) 까봐(produce)!" 할 때.`, example:["Please produce your evidence in court.","He produced a document to support his claim.","She produced proof of purchase."], subject:"영어"},
{en:"refuse", meaning1:"거절하다", meaning:"쓰레기", context:`"이 쓰레기(refuse) 갖다 버려!" (명사로 쓰임)`, example:["The refuse was collected early morning.","Household refuse piled up outside.","They dumped the refuse illegally."], subject:"영어"},
{en:"tear", meaning1:"눈물", meaning:"찢다", context:`(눈물은 '티어', 찢는 건 '테어') 발음 주의!`, example:["He began to tear the paper apart.","She tore the letter into pieces.","Don't tear the pages of the book."], subject:"영어"},
];
const IDIOM = {en:"塞翁之馬", meaning1:"", meaning:"세상 일의 좋고 나쁨은 예측 불가", context:"고전 수필·격언집에서 자주 등장", example:["전화위복과 같은 뜻으로 쓰인다.","인생사 새옹지마라는 말도 있다.","고진감래와 함께 자주 인용된다."], subject:"한자", isIdiom:true};

/* ---------- 공유하기 ---------- */
function doShare(){
  const isWeb = /^https?:/.test(location.protocol);
  const shareData = isWeb ? {title:'단어장', text:TAGLINES[0], url:location.href} : {title:'단어장', text:TAGLINES[0]};
  if(navigator.share){ navigator.share(shareData).catch(()=>{}); return; }
  if(isWeb && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(location.href).then(()=>alert('링크 복사됨')).catch(()=>prompt('링크 복사', location.href));
  } else { alert('공유하려면 웹 주소로 배포 필요 (현재는 로컬 파일)'); }
}
document.getElementById('shareBtn').onclick = doShare;

/* ---------- 상태 ---------- */
const LS_WRONG='voca_wrong_pool', LS_ADV='voca_advantage', LS_SHEET='voca_sheet_url',
      LS_SET='voca_set', LS_SET_START='voca_set_started_at', LS_STATS='voca_wordstats';
function lj(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sj(k,v){localStorage.setItem(k, JSON.stringify(v));}

let wrongPool = lj(LS_WRONG, []);
let advantage = lj(LS_ADV, 0);
let wordStats = lj(LS_STATS, {});
let sessionVotes = {};
let sheetRows = lj('voca_sheet_rows', null);
let currentSet = lj(LS_SET, 1);
if(!localStorage.getItem(LS_SET_START)) localStorage.setItem(LS_SET_START, Date.now());

function csvParse(text){
  const lines = text.trim().split('\n');
  const head = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(l=>{
    const cols = l.split(',');
    const o={}; head.forEach((h,i)=>o[h]=(cols[i]||'').trim());
    return o;
  });
}
async function loadSheet(url){
  try{
    const r = await fetch(url); const txt = await r.text();
    const rows = csvParse(txt);
    sheetRows = rows; sj('voca_sheet_rows', rows); sj(LS_SHEET, url);
    alert('불러오기 완료: '+rows.length+'개');
    boot();
  }catch(e){ alert('불러오기 실패. CSV 게시 링크 확인'); }
}
document.getElementById('gear').onclick=()=>{
  const cur = localStorage.getItem(LS_SHEET)||'';
  const url = prompt('구글시트를 "웹에 게시 > CSV"로 게시한 뒤, 그 링크를 붙여넣으세요.\n필요한 열: set,en,meaning1,meaning,context,example1,example2,example3,subject', cur);
  if(url) loadSheet(url);
};
function wordsFromSheet(setNo){
  if(!sheetRows) return null;
  return sheetRows.filter(r=>String(r.set)===String(setNo)).map(r=>({
    en:r.en, meaning1:r.meaning1, meaning:r.meaning, context:r.context, example:[r.example1,r.example2,r.example3].filter(Boolean), subject:r.subject
  }));
}

/* ---------- 덱 구성 ---------- */
function buildDeck(){
  const pool = wordsFromSheet(currentSet) || SEED;
  const newWords = [...pool].sort(()=>Math.random()-0.5).slice(0,9);
  const reviewWords = wrongPool.sort(()=>Math.random()-0.5).slice(0,5);
  const deck = [...newWords, ...reviewWords].sort(()=>Math.random()-0.5);
  deck.splice(Math.min(5, deck.length), 0, IDIOM);
  return deck;
}
let deck=[];

/* ---------- 텍스트 등장 모션 엔진 ---------- */
const ENTRANCE = ['wave','blur','skate','scramble','beat','smooth','flip','spacing'];
let motionCounter = 0;
function charSpans(text){
  return [...text].map(c=>`<span class="cw">${c===' '?'&nbsp;':c}</span>`).join('');
}
function playEnter(el, text){
  const style = ENTRANCE[motionCounter % ENTRANCE.length]; motionCounter++;
  el.style.opacity='1';
  if(style==='blur' || style==='smooth' || style==='spacing'){
    el.textContent = text;
    el.className = el.className.replace(/blk-\w+( on)?/g,'').trim();
    const cls = style==='blur' ? 'blk-blur' : style==='smooth' ? 'blk-smooth' : 'blk-spacing';
    el.classList.add(cls);
    requestAnimationFrame(()=> requestAnimationFrame(()=> el.classList.add('on')));
    return;
  }
  el.classList.remove('blk-blur','blk-smooth','blk-spacing','on');
  if(style==='scramble'){
    const glyphs='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
    let frame=0; const total=text.length;
    const interval=setInterval(()=>{
      frame++;
      el.textContent = text.split('').map((ch,i)=>{
        if(ch===' ') return ' ';
        const settleAt = Math.floor((i/total)*10)+4;
        if(frame>=settleAt) return ch;
        return glyphs[Math.floor(Math.random()*glyphs.length)];
      }).join('');
      if(frame>14){ clearInterval(interval); el.textContent=text; }
    }, 40);
    return;
  }
  el.innerHTML = charSpans(text);
  const spans = el.querySelectorAll('.cw');
  const len = spans.length, mid=(len-1)/2;
  const waveVariant = ['center','left','bottom'][Math.floor(Math.random()*3)];
  spans.forEach((s,i)=>{
    let delay=0, cls='cw-wave';
    if(style==='wave'){ cls='cw-wave'; delay = waveVariant==='center' ? Math.abs(i-mid)*0.09 : i*0.09; }
    else if(style==='skate'){ cls='cw-skate'; delay=i*0.06; }
    else if(style==='flip'){ cls='cw-flip'; delay=i*0.05; }
    else if(style==='beat'){ const stressIdx = Math.floor(len*0.4); cls = i===stressIdx ? 'cw-beat' : 'cw-fade'; delay = i*0.03; }
    s.style.animationDelay = delay+'s';
    s.classList.add(cls);
  });
}
const EXIT_DIRS=['exit-up','exit-right','exit-down','exit-left'];
function playExit(el, cb){
  const dir = EXIT_DIRS[Math.floor(Math.random()*4)];
  el.classList.remove('blk-blur','blk-smooth','blk-spacing','on');
  el.style.animation='';
  void el.offsetWidth;
  el.classList.add(dir);
  setTimeout(()=>{ el.classList.remove(dir); el.style.opacity='0'; cb&&cb(); }, 220);
}

/* ---------- 렌더 ---------- */
const reels = document.getElementById('reels');
const dotsEl = document.getElementById('dots');

const FONTS = ["'Poppins',sans-serif","'DM Serif Display',serif","'Bebas Neue',sans-serif","'Caveat',cursive","'Space Grotesk',sans-serif"];
function slideHTML(w, i){
  const font = FONTS[i % FONTS.length];
  const idiomStyle = w.isIdiom ? 'font-size:34px; white-space:normal; line-height:1.3;' : '';
  return `
  <div class="slide" data-i="${i}" data-en="${w.en}">
    <div class="hook">${TAGLINES[i % TAGLINES.length]}</div>
    <div class="hintline">${w.context || ''}</div>
    <div class="morphbox" id="box-${i}">
      <span class="mtext en" id="en-${i}" style="opacity:0; font-family:${font}; ${idiomStyle}"></span>
      <span class="mtext ko" id="ko-${i}" style="opacity:0; display:none"></span>
    </div>
    ${w.meaning1 ? `<div class="primaryTag">1번째 뜻: ${w.meaning1}</div>` : ''}
    <button class="darkToggle" id="dt-${i}" data-i="${i}">
      <span class="knob" id="dtknob-${i}">☀️</span>
      <span class="label r show">got it</span>
      <span class="label l">again</span>
    </button>
    ${w.example && w.example.length ? `<div class="swipeHint">←<span>swipe</span></div>` : ''}
    <div class="pullHint">↑<span>pull up</span></div>
  </div>`;
}
function endSlideHTML(){
  return `<div class="slide" data-i="end">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;">
      <div style="font-size:19px;font-weight:400;">오늘 준비된 단어 끝</div>
      <button class="big-btn" id="finishBtn">학습 마무리</button>
    </div></div>`;
}
function renderDots(){
  const n = deck.length+1;
  const active = window.__activeIdx || 0;
  dotsEl.innerHTML = Array.from({length:n}).map((_,i)=>`<div class="dot ${i===active?'on':''}"></div>`).join('');
}

/* ---------- 단어 탭 => 영/한 전환 ---------- */
const wordState = {};
function initWord(i){
  const w = deck[i];
  const enEl=document.getElementById('en-'+i), koEl=document.getElementById('ko-'+i), box=document.getElementById('box-'+i);
  if(!enEl) return;
  enEl.style.display='inline-block'; koEl.style.display='none';
  wordState[i]='en';
  playEnter(enEl, w.en);
  box.onclick = ()=>{
    if(navigator.vibrate) navigator.vibrate(8);
    if(wordState[i]==='en'){
      playExit(enEl, ()=>{ enEl.style.display='none'; koEl.style.display='inline-block'; playEnter(koEl, w.meaning); wordState[i]='ko'; });
    } else {
      playExit(koEl, ()=>{ koEl.style.display='none'; enEl.style.display='inline-block'; playEnter(enEl, w.en); wordState[i]='en'; });
    }
  };
}

/* ---------- 밝기 토글 = 몰라요 표시, 다음 단어는 항상 브라이트 ---------- */
reels.addEventListener('click', e=>{
  const dt = e.target.closest('.darkToggle');
  if(!dt) return;
  e.stopPropagation();
  if(navigator.vibrate) navigator.vibrate(8);
  const i = +dt.dataset.i;
  const slideEl = document.querySelector(`.slide[data-i="${i}"]`);
  const nowDark = slideEl.classList.toggle('dark-local');
  dt.classList.toggle('dark', nowDark); // 위치 이동 즉시 시작(1s transition)
  const kn = document.getElementById('dtknob-'+i);
  kn.classList.remove('spinning'); void kn.offsetWidth; kn.classList.add('spinning');
  const labelR = dt.querySelector('.label.r'), labelL = dt.querySelector('.label.l');
  const hiding = nowDark ? labelR : labelL, showing = nowDark ? labelL : labelR;
  hiding.classList.remove('show'); // 즉시 디졸브 아웃
  setTimeout(()=>{ kn.textContent = nowDark ? '🌙' : '☀️'; kn.style.background = nowDark ? '#D7E3FF' : '#FFD400'; }, 500); // 50% 지점 아이콘/색 전환
  setTimeout(()=>{
    kn.classList.remove('spinning');
    kn.classList.add('land'); setTimeout(()=>kn.classList.remove('land'), 300);
    showing.classList.add('show'); // 도착 후 디졸브 인
  }, 1000);
});

function finalizeVote(i){
  const w = deck[i]; if(!w) return;
  const slideEl = document.querySelector(`.slide[data-i="${i}"]`);
  const isDark = slideEl && slideEl.classList.contains('dark-local');
  const vote = isDark ? 'dont' : 'know';
  sessionVotes[w.en]=vote;
  const st = wordStats[w.en] || {know:0, dont:0};
  if(vote==='know'){ st.know++; wrongPool = wrongPool.filter(p=>p.en!==w.en); }
  else{
    st.dont++;
    const existing = wrongPool.find(p=>p.en===w.en);
    if(existing) existing.misses=(existing.misses||1)+1;
    else wrongPool.push({en:w.en, meaning:w.meaning, example:w.example, subject:w.subject, misses:1});
  }
  wordStats[w.en]=st; sj(LS_STATS, wordStats); sj(LS_WRONG, wrongPool);
}

/* ---------- 왼쪽 스와이프: 풀스크린 예문뷰(3개 순환) ---------- */
let exI = 0, exWordI = null;
function renderExample(){
  const w = deck[exWordI]; if(!w) return;
  const sentence = w.example[exI];
  const re = new RegExp('('+w.en+'\\s+\\S+|'+w.en+')', 'i');
  const enHtml = sentence.replace(re, m=>`<span class="hl" id="hlEn">${m}</span>`);
  document.getElementById('exEnText').innerHTML = enHtml;
  document.getElementById('exKoText').innerHTML = `<span class="hl" id="hlKo">${w.meaning}</span>`;
  document.getElementById('exDots').innerHTML = w.example.map((_,k)=>`<i class="${k===exI?'on':''}"></i>`).join('');
  const hlEn=document.getElementById('hlEn'), hlKo=document.getElementById('hlKo');
  hlEn.classList.remove('draw'); hlKo.classList.remove('draw');
  requestAnimationFrame(()=>{
    hlEn.classList.add('draw');
    setTimeout(()=> hlKo.classList.add('draw'), 300);
  });
}
function openExample(i){
  const w = deck[i]; if(!w || !w.example || !w.example.length) return;
  exWordI = i; exI = 0;
  if(navigator.vibrate) navigator.vibrate(8);
  renderExample();
  document.getElementById('exampleView').classList.add('show');
}
function closeExample(){
  if(navigator.vibrate) navigator.vibrate(8);
  document.getElementById('exampleView').classList.remove('show');
}

let hx=0, hy=0, hlx=0, hly=0, hdrag=false, hslideI=null;
reels.addEventListener('pointerdown', e=>{
  const slide = e.target.closest('.slide'); if(!slide || slide.dataset.i==='end') return;
  hdrag=true; hx=e.clientX; hy=e.clientY; hlx=hx; hly=hy; hslideI=+slide.dataset.i;
});
reels.addEventListener('pointermove', e=>{ if(hdrag){ hlx=e.clientX; hly=e.clientY; } });
function endSwipe(){
  if(!hdrag) return; hdrag=false;
  const dx=hlx-hx, dy=hly-hy;
  if(dx<-50 && Math.abs(dx)>Math.abs(dy)){ openExample(hslideI); } // 왼쪽스와이프 = 다음(예문)
}
reels.addEventListener('pointerup', endSwipe);
reels.addEventListener('pointercancel', endSwipe);

/* exampleView 내부 스와이프: 오른쪽=back, 왼쪽=다음 예문 */
const exView = document.getElementById('exampleView');
let exx=0, exy=0, exlx=0, exly=0, exdrag=false;
exView.addEventListener('pointerdown', e=>{ exdrag=true; exx=e.clientX; exy=e.clientY; exlx=exx; exly=exy; });
exView.addEventListener('pointermove', e=>{ if(exdrag){ exlx=e.clientX; exly=e.clientY; } });
function endExSwipe(){
  if(!exdrag) return; exdrag=false;
  const dx=exlx-exx, dy=exly-exy;
  if(Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)) return;
  if(dx>0){ closeExample(); }
  else { exI = (exI+1) % deck[exWordI].example.length; if(navigator.vibrate) navigator.vibrate(8); renderExample(); }
}
exView.addEventListener('pointerup', endExSwipe);
exView.addEventListener('pointercancel', endExSwipe);

/* ---------- 활성 슬라이드 감지 ---------- */
let io;
const activated = new Set();
function setupObserver(){
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      const i = en.target.dataset.i;
      if(en.isIntersecting && en.intersectionRatio>0.6){
        window.__activeIdx = i==='end' ? deck.length : +i;
        renderDots();
        if(i!=='end'){
          const slideEl = en.target;
          slideEl.classList.remove('dark-local');
          const dt = document.getElementById('dt-'+i);
          if(dt){
            dt.classList.remove('dark');
            const kn=document.getElementById('dtknob-'+i); if(kn){ kn.textContent='☀️'; kn.style.background='#FFD400'; kn.classList.remove('spinning','land'); }
            const lr=dt.querySelector('.label.r'), ll=dt.querySelector('.label.l');
            if(lr) lr.classList.add('show'); if(ll) ll.classList.remove('show');
          }
          activated.add(+i);
          initWord(+i);
        }
      } else if(i!=='end' && activated.has(+i)){
        finalizeVote(+i);
      }
    });
  }, {threshold:[0,0.6,1]});
  document.querySelectorAll('.slide').forEach(s=>io.observe(s));
}

/* ---------- 부트 ---------- */
function boot(){
  deck = buildDeck();
  motionCounter = 0;
  reels.innerHTML = deck.map((w,i)=>slideHTML(w,i)).join('') + endSlideHTML();
  renderDots();
  setupObserver();
  document.getElementById('finishBtn').onclick = startSpellTest;
}
function startSpellTest(){
  const queue = Object.keys(sessionVotes).filter(en=>sessionVotes[en]==='dont')
    .map(en=> deck.find(w=>w.en===en) || wrongPool.find(w=>w.en===en))
    .filter(w=>w && !w.isIdiom);
  let qi=0;
  const app=document.getElementById('app');
  function draw(){
    if(qi>=queue.length) return renderEnd();
    const w = queue[qi];
    app.innerHTML = `
      <div class="spell-wrap">
        <div class="spell-tag">메타인지 테스트 · ${qi+1}/${queue.length}</div>
        <div class="spell-card">
          <div class="ko">${w.meaning}</div>
          <input id="spellInput" placeholder="영어로 써보세요" autocomplete="off" autocapitalize="off">
          <div class="answer" id="answerLine" style="display:none;"></div>
          <div class="flash-pop" id="flashPop">⚡ 어드밴티지 +1</div>
          <button id="spellSubmit">확인</button>
        </div>
      </div>`;
    const input=document.getElementById('spellInput'); input.focus();
    function submit(){
      const val=input.value.trim().toLowerCase();
      const ok = val===w.en.toLowerCase();
      input.classList.add(ok?'correct':'incorrect');
      if(ok){
        advantage++; sj(LS_ADV, advantage);
        wrongPool = wrongPool.filter(p=>p.en!==w.en); sj(LS_WRONG, wrongPool);
        document.getElementById('flashPop').classList.add('show');
      } else {
        document.getElementById('answerLine').style.display='block';
        document.getElementById('answerLine').textContent = `정답: ${w.en}`;
      }
      document.getElementById('spellSubmit').style.display='none';
      input.disabled=true;
      setTimeout(()=>{ qi++; draw(); }, 1200);
    }
    document.getElementById('spellSubmit').onclick=submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  }
  draw();
}
function renderEnd(){
  const wrongToday = Object.keys(sessionVotes).filter(en=>sessionVotes[en]==='dont')
    .map(en=> deck.find(w=>w.en===en) || {en, meaning:''});
  const startedAt = +localStorage.getItem(LS_SET_START);
  const daysPassed = (Date.now()-startedAt)/86400000;
  const nextSetExists = wordsFromSheet(currentSet+1) !== null;
  let gate = '';
  if(daysPassed < 3){
    gate = `<div class="next-set">다음 세트까지 ${Math.ceil(3-daysPassed)}일 남음<br>작심삼일 채우면 세트 ${currentSet+1} 오픈</div>`;
  } else if(nextSetExists){
    gate = `<div class="next-set">세트 ${currentSet+1} 오픈 완료<br><button class="big-btn" id="nextSetBtn" style="margin-top:10px;">다음 세트 시작</button></div>`;
  } else {
    gate = `<div class="next-set">다음 세트 단어를 구글시트에 추가하면 이어서 열려요</div>`;
  }
  document.getElementById('app').innerHTML = `<div id="end"></div>`;
  const end=document.getElementById('end');
  end.innerHTML = `
    <h2>오늘 학습 끝 · 세트 ${currentSet}</h2>
    <div class="sub2">몰라요 ${wrongToday.length}개</div>
    <div class="adv-badge">⚡ 누적 어드밴티지 ${advantage}</div>
    ${wrongToday.length ? wrongToday.map(w=>`<div class="wrong-item"><div class="en">${w.en}</div><div class="ko">${w.meaning}</div></div>`).join('') : '<p style="color:var(--sub)">오늘은 다 맞았어요</p>'}
    ${wrongToday.length ? '<button class="kakao-btn" id="kakaoBtn">틀린 단어 복사 (카톡 공유)</button>' : ''}
    <button class="share-btn" id="shareBtn2">친구에게 보내기</button>
    <button class="share-btn" id="restartBtn">처음부터 다시</button>
    ${gate}
  `;
  document.getElementById('restartBtn').onclick=()=>location.reload();
  const nb = document.getElementById('nextSetBtn');
  if(nb) nb.onclick=()=>{ currentSet++; sj(LS_SET,currentSet); localStorage.setItem(LS_SET_START, Date.now()); location.reload(); };
  const kb = document.getElementById('kakaoBtn');
  if(kb) kb.onclick=()=>{
    const code = 'A' + Date.now().toString().slice(-4);
    const txt = wrongToday.map(w=>`${w.en},${w.meaning}`).join('\n');
    navigator.clipboard.writeText(`SET:${code}\n${txt}`).then(()=>{ kb.textContent='복사됨!'; });
  };
  document.getElementById('shareBtn2').onclick = doShare;
}

const savedUrl = localStorage.getItem(LS_SHEET);
if(savedUrl){ loadSheet(savedUrl); } else { boot(); }
</script>

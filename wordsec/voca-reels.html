<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base href="/wordsec/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>단어장</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=DM+Serif+Display&family=Bebas+Neue&family=Caveat:wght@700&family=Space+Grotesk:wght@700&family=Nanum+Myeongjo:wght@700&display=swap');

:root{
  --bg:#F3F1ED; --ink:#161616; --sub:#7A766E; --card:#FFFFFF;
  --accent:#161616; --track:#D8D3C8; --gold:#B98900;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
html,body{height:100dvh; overflow:hidden; background:var(--bg); font-family:'Pretendard',sans-serif; color:var(--ink); overscroll-behavior:none}
#app{position:fixed; inset:0; max-width:480px; margin:0 auto; background:var(--bg); opacity:0; animation:appIn .35s ease forwards;}
@keyframes appIn{to{opacity:1;}}
body.from-home #app{animation:slideInRight .45s cubic-bezier(.25,.8,.35,1) forwards;}
@keyframes slideInRight{from{opacity:0; transform:translateX(45%);} to{opacity:1; transform:translateX(0);}}

#topRight{position:fixed; top:14px; right:14px; z-index:60; display:flex; gap:8px;}
#topRight button{width:34px; height:34px; border-radius:50%; background:var(--card); border:1px solid var(--track); color:var(--ink); display:flex; align-items:center; justify-content:center; transition:background .3s, border-color .3s, color .3s;}
body.screen-dark #topRight button{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.25); color:#fff;}

#dots{position:fixed; right:8px; top:50%; transform:translateY(-50%); z-index:55; display:flex; flex-direction:column; gap:6px;}
.dot{width:5px; height:5px; border-radius:50%; background:var(--track); transition:background .3s;}
.dot.on{background:var(--accent); height:16px; border-radius:4px;}
body.screen-dark .dot{background:rgba(255,255,255,.2);}

#reels{height:100%; overflow:hidden; position:relative;}
#reels::-webkit-scrollbar{display:none;}
#track{position:absolute; top:0; left:0; width:100%; will-change:transform;}
.slide{height:100vh; position:relative; display:flex; flex-direction:column;
  justify-content:center; align-items:center; overflow:hidden; padding:26px; touch-action:none;
  background:var(--bg); color:var(--ink); transition:background .3s, color .3s;}
.slide.dark-local{
  --bg:#16193e; --ink:#F5F3F7; --sub:#8B8896; --card:#16151F; --track:#26232E; --accent:#F5F3F7;
}

.hook{text-align:center; font-size:12px; font-weight:400; color:var(--sub); line-height:1.5; margin-bottom:10px; max-width:300px;}
.hintline{font-size:16px; color:var(--ink); font-weight:600; margin-bottom:18px; line-height:1.5; max-width:290px; text-align:center;}

.primaryTag{font-size:13px; color:var(--sub); margin-top:8px;}
.morphbox{position:relative; height:190px; width:100%; display:flex; align-items:center; justify-content:center; margin:14px 0; opacity:1; transition:opacity .5s ease;}
.slide.fading .morphbox{opacity:0; transition:opacity .22s ease;}
.mtext{font-size:52px; font-weight:800; text-align:center; white-space:nowrap; line-height:1.3;}
.mtext.ko{font-size:30px; font-weight:400; white-space:normal; word-break:keep-all; max-width:320px; margin:0 auto;}
.mtext .cw{display:inline-block;}


@keyframes cwWave{from{opacity:0; transform:translateY(7px) scale(.85);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes cwSkate{from{opacity:0; transform:translate(14px,3px) skewX(-10deg);} to{opacity:1; transform:translate(0,0) skewX(0);}}
@keyframes cwFlip{from{opacity:0; transform:rotateX(85deg);} to{opacity:1; transform:rotateX(0);}}
@keyframes cwFade{from{opacity:0;} to{opacity:1;}}
@keyframes cwBeat{0%{opacity:0; transform:scale(.6);} 40%{opacity:1; transform:scale(1.3);} 60%{transform:scale(.92);} 80%{transform:scale(1.12);} 100%{transform:scale(1);}}
.cw-wave{animation:cwWave .35s ease-out forwards;}
.cw-skate{animation:cwSkate .3s ease-out forwards;}
.cw-flip{animation:cwFlip .3s ease-out forwards;}
.cw-fade{animation:cwFade .25s ease-out forwards;}
.cw-beat{animation:cwBeat .5s cubic-bezier(.3,1.6,.4,1) forwards;}

.blk-blur{filter:blur(8px); opacity:0; transition:filter .4s ease, opacity .4s ease;}
.blk-blur.on{filter:blur(0); opacity:1;}
.blk-smooth{filter:blur(3px); opacity:0; transform:scale(1.02); transition:filter .55s ease, opacity .55s ease, transform .55s ease;}
.blk-smooth.on{filter:blur(0); opacity:1; transform:scale(1);}
.blk-spacing{letter-spacing:-6px; opacity:.35; transition:letter-spacing .5s ease, opacity .5s ease;}
.blk-spacing.on{letter-spacing:normal; opacity:1;}

.exit-up{animation:exU .22s ease-in forwards;} .exit-down{animation:exD .22s ease-in forwards;}
.exit-left{animation:exL .22s ease-in forwards;} .exit-right{animation:exR .22s ease-in forwards;}
@keyframes exU{to{opacity:0; transform:translateY(-14px);}}
@keyframes exD{to{opacity:0; transform:translateY(14px);}}
@keyframes exL{to{opacity:0; transform:translateX(-14px);}}
@keyframes exR{to{opacity:0; transform:translateX(14px);}}

.darkToggle{position:relative; width:101px; height:45px; border-radius:999px; border:none;
  background:#8ECBEE; margin-top:20px; padding:0; transition:background 1s;}
.darkToggle.dark{background:#282f59;}
.darkToggle .knob{position:absolute; top:4px; left:4px; width:37px; height:37px; border-radius:50%;
  background:#FFD400; font-size:18px; display:flex; align-items:center; justify-content:center;
  transition:left 1s cubic-bezier(.34,1.56,.64,1); box-shadow:0 2px 8px rgba(0,0,0,.2);}
.darkToggle.dark .knob{left:60px;}
@keyframes knobSpin{from{transform:rotate(0deg) scale(1);} to{transform:rotate(360deg) scale(1);}}
@keyframes knobLand{0%{transform:scale(1);} 45%{transform:scale(1.18);} 100%{transform:scale(1);}}
.darkToggle .knob.spinning{animation:knobSpin 1s linear;}
.darkToggle .knob.land{animation:knobLand .3s ease-out;}
.darkToggle .label{position:absolute; top:50%; transform:translateY(-50%); font-size:13px; color:#fff; text-align:center;
  opacity:0; transition:opacity .35s ease; pointer-events:none;}
.darkToggle .label.show{opacity:1;}
.darkToggle .label.r{left:41px; width:52px; font-weight:800;}
.darkToggle .label.l{left:4px; width:52px; font-weight:400;}

#guide{position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center;}
#guide.guide-hidden{display:none;}
.guideCard{background:transparent; width:100%; height:100%; max-width:480px; position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding-bottom:calc(env(safe-area-inset-bottom) + 24px);}
.guideImg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.9;}
.guideChk{position:relative; display:flex; align-items:center; gap:7px; font-size:12px; color:rgba(255,255,255,.7); margin:0 24px 14px;}
.guideChk input{width:auto;}
.guideBtn{position:relative; width:calc(100% - 48px); margin:0 24px; background:var(--accent); color:#fff; border:none; padding:14px; border-radius:14px; font-weight:900; font-size:14px;}
#exampleView{position:fixed; inset:0; z-index:65; background:#16193e; color:#fff; padding:26px; touch-action:none;
  transform:translateX(100%); transition:transform .42s cubic-bezier(.34,1.28,.5,1), background .3s; display:flex; flex-direction:column;}
#exampleView.show{transform:translateX(0);}
#exBack{align-self:flex-start; color:rgba(255,255,255,.7); font-size:30px; line-height:1; margin-bottom:30px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; margin-left:-6px;}
.exDots{display:flex; gap:5px; align-self:center; margin-bottom:6px;}
.exDots i{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.25);}
.exDots i.on{background:#fff;}
.exBody{flex:1; display:flex; flex-direction:column; justify-content:center; transition:transform .38s cubic-bezier(.34,1.28,.5,1), opacity .3s ease;}
.exBody.slideIn{animation:exSlideIn .42s cubic-bezier(.34,1.28,.5,1);}
@keyframes exSlideIn{0%{transform:translateX(60px); opacity:0;} 100%{transform:translateX(0); opacity:1;}}
.exEn{font-size:22px; line-height:1.6; font-family:'Georgia',serif;}
.exDivider{height:1px; background:#5e6791; margin:30px 0; opacity:.6;}
.exKo{font-size:15px; line-height:1.7; color:rgba(255,255,255,.8);}
#exSwipeBtn{position:absolute; right:26px; bottom:calc(env(safe-area-inset-bottom) + 26px); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25); color:#fff; padding:9px 16px; border-radius:999px; font-size:13px; font-family:inherit;}
@keyframes hlDraw{0%{background-size:0% 60%; transform:skewX(0deg);} 60%{transform:skewX(-2deg);} 100%{background-size:100% 60%; transform:skewX(0deg);}}
.hl{background-image:linear-gradient(#000B99,#000B99); background-repeat:no-repeat; background-size:0% 60%;
  background-position:0 88%; padding:0 1px; display:inline-block;}
.hl.draw{animation:hlDraw .5s ease-out forwards;}

.center-screen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:30px; text-align:center; gap:16px; background:var(--bg);}
.center-screen h2{font-size:19px; font-weight:400;}
.center-screen p{color:var(--sub); font-size:13px;}
.video-link{background:var(--card); border:2px solid var(--gold); color:var(--gold); padding:13px 24px; border-radius:16px; font-weight:800; text-decoration:none;}
.big-btn{background:var(--accent); color:#fff; border:none; padding:13px 28px; border-radius:16px; font-weight:900; font-size:14px;}
.big-btn:disabled{opacity:.3;}

.spell-wrap{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:26px; background:var(--bg);}
.spell-tag{color:var(--sub); font-size:12px; margin-bottom:10px;}
.spell-card{background:var(--card); border:none; border-radius:22px; padding:30px 22px; text-align:center; width:100%; max-width:340px; box-shadow:0 8px 30px rgba(0,0,0,.08);}
.spell-card .ko{font-size:22px; font-weight:400; margin-bottom:16px;}
.spell-card input{width:100%; background:#EFEDE8; border:none; border-radius:14px; color:var(--ink); padding:16px; font-size:18px; text-align:center; font-weight:700;}
.spell-card input:focus{outline:none; background:#E6E3DC;}
.spell-card input.correct{background:#DFF3EA;}
.spell-card input.incorrect{background:#FBE4E9;}
.spell-card .answer{margin-top:8px; color:#E23A5D; font-size:13px;}
.spell-card button{margin-top:16px; background:var(--accent); color:#fff; border:none; padding:12px 26px; border-radius:14px; font-weight:900;}
.flash-pop{font-size:12px; color:var(--gold); margin-top:8px; font-weight:800; opacity:0;}
.flash-pop.show{opacity:1;}

#end{position:absolute; inset:0; overflow-y:auto; padding:24px 20px 40px; background:var(--bg); transition:background .3s;}
.endHeader{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
.endHeadL{text-align:left;}
#end h2{font-size:15px; font-weight:500; margin-bottom:4px; color:#161616; opacity:.85; text-align:left;}
#end .setdate{font-size:11px; color:#161616; opacity:.45; text-align:left;}
#end.dark h2{color:#fff;}
#end.dark .setdate{color:#fff;}
@keyframes dissolveUp{from{opacity:0; transform:translateY(10px); filter:blur(3px);} to{opacity:1; transform:translateY(0); filter:blur(0);}}
#end > *{opacity:0; animation:dissolveUp .5s ease forwards;}
#end > *:nth-child(1){animation-delay:.05s;}
#end > *:nth-child(2){animation-delay:.13s;}
#end > *:nth-child(3){animation-delay:.21s;}
#end > *:nth-child(4){animation-delay:.29s;}
#end > *:nth-child(n+5){animation-delay:.37s;}
#end.dark{background:#16193e; color:#fff;}
.endToggle{position:relative; width:101px; height:45px; border-radius:999px; border:none; background:#8ECBEE; transition:background 1s; flex:0 0 auto;}
.endToggle.dark{background:#282f59;}
.endToggle .knob{position:absolute; top:4px; left:4px; width:37px; height:37px; border-radius:50%; background:#FFD400; font-size:18px;
  display:flex; align-items:center; justify-content:center; transition:left 1s cubic-bezier(.34,1.56,.64,1), background .5s; box-shadow:0 2px 8px rgba(0,0,0,.2);}
.endToggle.dark .knob{left:60px; background:#D7E3FF;}
.endToggle .elabel{position:absolute; top:50%; transform:translateY(-50%); font-size:13px; color:#fff; text-align:center;}
.endToggle .elabel.r{left:41px; width:52px; font-weight:800;} .endToggle .elabel.l{left:4px; width:52px; font-weight:400; display:none;}
.endToggle.dark .elabel.r{display:none;} .endToggle.dark .elabel.l{display:block;}

/* 카드 스택: absolute + translateY (접힘 기본, 탭하면 펼침) */
#stackList{position:relative; margin:10px auto 30px; width:210px;}
.wcard{position:absolute; left:0; width:210px; height:125px;
  background:linear-gradient(160deg,#FFFFFF 0%,#EDEBE6 100%); border:none; border-radius:18px;
  padding:16px 20px; box-shadow:0 14px 24px -6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  transition:transform .5s cubic-bezier(.34,1.4,.5,1), box-shadow .4s;}
#end.dark .wcard{background:linear-gradient(160deg,#3a4568 0%,#232b46 100%); box-shadow:0 14px 24px -6px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);}
.wcard .en{font-weight:600; font-size:19px; font-family:'Nanum Myeongjo','Apple SD Gothic Neo',serif;}
.wcard .ko{color:var(--ink); font-size:20px; font-weight:700; opacity:0; height:0; overflow:hidden; transition:opacity .35s;}
#end.dark .wcard .ko{color:#fff;}
.wcard.open{box-shadow:0 30px 54px -8px rgba(0,0,0,.5); z-index:999 !important; justify-content:center;}
.wcard.open .en{display:none;}
.wcard.open .ko{opacity:1; height:auto;}
.next-set{background:var(--card); border:1px dashed var(--track); border-radius:16px; padding:16px; margin-top:18px; text-align:center; font-size:13px; color:var(--sub);}
.kakao-btn{margin:30px auto 0; display:block; width:260px; max-width:80%; background:#FEE500; color:#111; border:none; padding:13px; border-radius:14px; font-weight:500;}
.share-btn{margin:10px auto 0; display:block; width:260px; max-width:80%; background:var(--card); border:1px solid var(--track); color:var(--ink); padding:13px; border-radius:14px; font-weight:500;}
#end.dark .share-btn{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.2); color:#fff;}
</style>
</head>
<body>
<div id="app">
  <div id="topRight">
    <button id="homeBtn" aria-label="홈"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg></button>
    <button id="guideBtn" aria-label="사용법"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M8 7h7M8 11h7"/></svg></button>
    <button id="csBtn" aria-label="문의"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></button>
  </div>
  <div id="dots"></div>
  <div id="reels"></div>
</div>
<div id="guide" class="guide-hidden">
  <div class="guideCard">
    <img class="guideImg" src="https://img.jphic.co.kr/wordsec/img/user_guide.png?v=6" alt="사용법">
    <label class="guideChk"><input type="checkbox" id="guideNoShow"> 다음부터 열지않기</label>
    <button class="guideBtn" id="guideClose">시작하기</button>
  </div>
</div>
<div id="exampleView">
  <span id="exBack">‹</span>
  <div class="exDots" id="exDots"></div>
  <div class="exBody">
    <div class="exEn" id="exEnText"></div>
    <div class="exDivider"></div>
    <div class="exKo" id="exKoText"></div>
  </div>
  <button id="exSwipeBtn">← swipe</button>
</div>

<script>
if(new URLSearchParams(location.search).get('from')==='home') document.body.classList.add('from-home');
/* ---------- 브랜드 헤드카피 ---------- */
const TAGLINES = [
  "첫 뜻은 다 알잖아, 두 번째 뜻은 너만 알아",
  "두 번째 것, 너만 몰랐어",
  "첫사랑은 보내고 두 번째 사랑이 온다"
];
const HINT = "두 번째 뜻은?";

/* ---------- 샘플 시드 ---------- */
const SEED = [
{en:"present", meaning1:"선물, 현재의", meaning:"진술하다, 제기하다", context:`(발표할 때) "PPT 보여줄게!" 할 때 그 제시는 'present'야.`, example:["She will present her findings tomorrow.","The lawyer will present new evidence.","He wants to present a solution to the board."], subject:"영어"},
{en:"novel", meaning1:"소설", meaning:"새로운, 참신한", context:`"이 생각 레알 신상 감인데?" → 완전 참신함!`, example:["This is a truly novel approach to teaching.","The novel method surprised everyone.","Her novel idea impressed the judges."], subject:"영어"},
{en:"content", meaning1:"내용물", meaning:"만족하는", context:`배부르면 텐션 올라가? "Content!"(만족!)`, example:["She seemed perfectly content with the results.","He felt content after finishing the marathon.","They were content just to relax at home."], subject:"영어"},
{en:"object", meaning1:"물건", meaning:"반대하다", context:`"난 반대야(Object)!" 법정 드라마 짤 생각하기.`, example:["I must object to this decision.","She objected strongly to the plan.","The lawyer objected during the trial."], subject:"영어"},
{en:"fine", meaning1:"좋은, 괜찮은", meaning:"벌금", context:`지각해서 낸 벌금. "Fine(좋아)?" 아니, 지갑 털렸어.`, example:["He had to pay a fine for speeding.","The court imposed a heavy fine.","She got a fine for littering."], subject:"영어"},
{en:"minute", meaning1:"분(시간)", meaning:"아주 작은, 사소한", context:`'마이뉴트'라고 읽음! 아주 작은 미세먼지(mini).`, example:["He noticed a minute difference in color.","There was a minute error in the report.","The details were almost too minute to see."], subject:"영어"},
{en:"desert", meaning1:"사막", meaning:"저버리다, 버리다", context:`친구를 사막에 버리고 혼자 도망가면 'desert'.`, example:["He would never desert his friends.","The soldiers refused to desert their post.","She felt he had deserted her in hard times."], subject:"영어"},
{en:"subject", meaning1:"과목", meaning:"~에 영향받기 쉬운", context:`"얘는 감기 걸리기 쉽네(subject to cold)."`, example:["The plan is subject to change.","Prices are subject to review.","The rule is subject to certain exceptions."], subject:"영어"},
{en:"contract", meaning1:"계약", meaning:"(병에) 걸리다", context:`세균이랑 질병이 나랑 계약 맺음. (안 좋은 계약!)`, example:["He contracted a serious illness abroad.","She contracted the flu last winter.","Workers may contract diseases from exposure."], subject:"영어"},
{en:"conduct", meaning1:"행동, 품행", meaning:"지휘하다", context:`오케스트라 지휘자. 음악을 이끄는 'conduct'.`, example:["He will conduct the orchestra tonight.","She conducts research on climate change.","The teacher conducted a small survey."], subject:"영어"},
{en:"table", meaning1:"탁자", meaning:"(안건을) 보류하다", context:`"이건 탁자 위에 올려두고 다음에 하자!" (보류)`, example:["They decided to table the motion.","The committee tabled the proposal.","Let's table this discussion for now."], subject:"영어"},
{en:"bear", meaning1:"곰", meaning:"참다, 견디다", context:`곰처럼 무거운 걸 들고 끙끙 참는 모습 상상.`, example:["I can hardly bear the pain.","She bore the criticism silently.","He couldn't bear to watch."], subject:"영어"},
{en:"produce", meaning1:"생산하다", meaning:"(증거를) 제시하다", context:`경찰이 "증거(evidence) 까봐(produce)!" 할 때.`, example:["Please produce your evidence in court.","He produced a document to support his claim.","She produced proof of purchase."], subject:"영어"},
{en:"refuse", meaning1:"거절하다", meaning:"쓰레기", context:`"이 쓰레기(refuse) 갖다 버려!" (명사로 쓰임)`, example:["The refuse was collected early morning.","Household refuse piled up outside.","They dumped the refuse illegally."], subject:"영어"},
{en:"tear", meaning1:"눈물", meaning:"찢다", context:`(눈물은 '티어', 찢는 건 '테어') 발음 주의!`, example:["He began to tear the paper apart.","She tore the letter into pieces.","Don't tear the pages of the book."], subject:"영어"},
];

/* ---------- 공유하기 ---------- */
function doShare(){
  const isWeb = /^https?:/.test(location.protocol);

function csvParse(text){
  const lines = text.trim().split('\n');
  const head = lines[0].split(',').map(h=>h.trim());
  return lines.slice(1).map(l=>{
    const cols = l.split(',');
    const o={}; head.forEach((h,i)=>o[h]=(cols[i]||'').trim());
    return o;
  });
}

/* ---------- 덱 구성: sets/{code}.csv 로드 ---------- */
function csvToWords(text){
  const rows=[]; const lines=text.replace(/\r/g,'').split('\n');
  const head=parseCsvLine(lines[0]);
  for(let i=1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    const cols=parseCsvLine(lines[i]); const o={};
    head.forEach((h,k)=>o[h.trim()]=(cols[k]||'').trim());
    rows.push({en:o.en, meaning1:o.meaning1, meaning:o.meaning, context:o.context,
      example:[o.example1,o.example2,o.example3].filter(Boolean)});
  }
  return rows.filter(w=>w.en);
}
function parseCsvLine(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===','){ out.push(cur); cur=''; } else cur+=c; }
  }
  out.push(cur); return out;
}
let deck=[];
async function buildDeck(){
  const code = new URLSearchParams(location.search).get('set');
  window.__setCode = code || 'SET';
  let pool = SEED;
  if(code){
    const step=code[0], mm=code.slice(1,3);
    try{
      const r = await fetch(`./sets/${step}/${mm}/${code}.csv`, {cache:'no-store'});
      if(r.ok){ const words = csvToWords(await r.text()); if(words.length) pool = words; }
    }catch(e){}
  }
  const newWords = [...pool].sort(()=>Math.random()-0.5).slice(0,15);
  window.__setFirstWord = newWords[0]?.en || '';
  const reviewWords = wrongPool.sort(()=>Math.random()-0.5).slice(0,5);
  return [...newWords, ...reviewWords].sort(()=>Math.random()-0.5);
}


/* ---------- 텍스트 등장 모션 엔진 ---------- */
const ENTRANCE = ['wave','blur','skate','scramble','beat','smooth','flip','spacing'];
let motionCounter = 0;
function charSpans(text){
  return [...text].map(c=>`<span class="cw">${c===' '?'&nbsp;':c}</span>`).join('');
}
function playEnter(el, text){
  const style = ENTRANCE[motionCounter % ENTRANCE.length]; motionCounter++;
  el.style.opacity='1'; el.style.transition=''; el.style.filter='';
  if(style==='blur' || style==='smooth' || style==='spacing'){
    el.textContent = text;
    el.className = el.className.replace(/blk-\w+( on)?/g,'').trim();
    const cls = style==='blur' ? 'blk-blur' : style==='smooth' ? 'blk-smooth' : 'blk-spacing';
    el.classList.add(cls);
    requestAnimationFrame(()=> requestAnimationFrame(()=> el.classList.add('on')));
    return;
  }
  el.classList.remove('blk-blur','blk-smooth','blk-spacing','on');
  if(style==='scramble'){
    const glyphs='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
    let frame=0; const total=text.length;
    const iv=setInterval(()=>{
      frame++;
      el.textContent = text.split('').map((ch,i)=>{
        if(ch===' ') return ' ';
        const settleAt = Math.floor((i/total)*8)+3;
        return frame>=settleAt ? ch : glyphs[Math.floor(Math.random()*glyphs.length)];
      }).join('');
      if(frame>12){ clearInterval(iv); el.textContent=text; }
    }, 40);
    return;
  }
  el.innerHTML = charSpans(text);
  const spans = el.querySelectorAll('.cw');
  const len = spans.length, mid=(len-1)/2;
  const wv = ['center','left','bottom'][Math.floor(Math.random()*3)];
  spans.forEach((s,i)=>{
    let delay=0, cls='cw-wave';
    if(style==='wave'){ cls='cw-wave'; delay = wv==='center' ? Math.abs(i-mid)*0.05 : i*0.05; }
    else if(style==='skate'){ cls='cw-skate'; delay=i*0.04; }
    else if(style==='flip'){ cls='cw-flip'; delay=i*0.035; }
    else if(style==='beat'){ const si=Math.floor(len*0.4); cls=i===si?'cw-beat':'cw-fade'; delay=i*0.02; }
    s.style.animationDelay = delay+'s';
    s.classList.add(cls);
  });
}
function playExit(el, cb){
  el.style.transition='opacity .18s ease';
  el.style.opacity='0';
  setTimeout(()=>{ cb&&cb(); }, 180);
}

const wordState = {};
function initWord(i){
  const w = deck[i];
  const enEl=document.getElementById('en-'+i), koEl=document.getElementById('ko-'+i), box=document.getElementById('box-'+i);
  if(!enEl) return;
  enEl.style.display='inline-block'; koEl.style.display='none';

  playEnter(enEl, w.en);
  box.onclick = ()=>{

      playExit(enEl, ()=>{ enEl.style.display='none'; koEl.style.display='inline-block'; playEnter(koEl, w.meaning); wordState[i]='ko'; });

      playExit(koEl, ()=>{ koEl.style.display='none'; enEl.style.display='inline-block'; playEnter(enEl, w.en); wordState[i]='en'; });
    }
  };
}

function finalizeVote(i){
  const w = deck[i]; if(!w) return;
  const slideEl = document.querySelector(`.slide[data-i="${i}"]`);
  const isDark = slideEl && slideEl.classList.contains('dark-local');
  const vote = isDark ? 'dont' : 'know';
  sessionVotes[w.en]=vote;
  const st = wordStats[w.en] || {know:0, dont:0};
  if(vote==='know'){ st.know++; wrongPool = wrongPool.filter(p=>p.en!==w.en); }
  else{
    st.dont++;
    const existing = wrongPool.find(p=>p.en===w.en);
    if(existing) existing.misses=(existing.misses||1)+1;
    else wrongPool.push({en:w.en, meaning:w.meaning, example:w.example, subject:w.subject, misses:1});
  }
  wordStats[w.en]=st; sj(LS_STATS, wordStats); sj(LS_WRONG, wrongPool);
}

const exView = document.getElementById('exampleView');
let exx=0, exy=0, exlx=0, exly=0, exdrag=false;
function exStart(x,y){ exdrag=true; exx=x; exy=y; exlx=x; exly=y; }
function exMove(x,y){ if(exdrag){ exlx=x; exly=y; } }
function endExSwipe(){
  if(!exdrag) return; exdrag=false;
  const dx=exlx-exx, dy=exly-exy;
  if(Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)) return;

}

/* ---------- 활성 슬라이드 감지 ---------- */
let io;
const activated = new Set();
/* ---------- 커스텀 스크롤 엔진 (ease-in-out) ---------- */
let curIdx = 0, totalSlides = 0, scrolling = false;
function slideActivate(i){
  window.__activeIdx = i;
  renderDots();
  const slideEl = document.querySelector(`.slide[data-i="${i}"]`);
  if(!slideEl || i>=deck.length) return; // end 슬라이드
  const firstVisit = !activated.has(i);
  if(firstVisit){
    slideEl.classList.remove('dark-local');
    document.body.classList.remove('screen-dark');
    const dt = document.getElementById('dt-'+i);
    if(dt){
      dt.classList.remove('dark');
      const kn=document.getElementById('dtknob-'+i); if(kn){ kn.textContent='☀️'; kn.style.background='#FFD400'; kn.classList.remove('spinning','land'); }
      const lr=dt.querySelector('.label.r'), ll=dt.querySelector('.label.l');
      if(lr) lr.classList.add('show'); if(ll) ll.classList.remove('show');
    }
  } else {
    document.body.classList.toggle('screen-dark', slideEl.classList.contains('dark-local'));
  }
  activated.add(i);
  slideEl.classList.remove('fading','enter'); void slideEl.offsetWidth; slideEl.classList.add('enter');
  initWord(i);
}
function slideDeactivate(i){
  if(i>=deck.length) return;
  finalizeVote(i);
  const slideEl = document.querySelector(`.slide[data-i="${i}"]`);
  if(slideEl){ slideEl.classList.remove('enter'); slideEl.classList.add('fading'); }
}
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; } // cubic ease-in-out
function scrollToIndex(target){
  target = Math.max(0, Math.min(totalSlides-1, target));
  if(target===curIdx || scrolling) return;
  scrolling = true;
  const track = document.getElementById('track');
  const H = window.innerHeight;
  const startY = -curIdx*H, endY = -target*H;
  const prev = curIdx;
  const dur = 620, t0 = performance.now();
  slideDeactivate(prev); // 이동 시작과 함께 이전 페이드아웃
  function frame(now){
    const p = Math.min(1, (now-t0)/dur);
    const y = startY + (endY-startY)*easeInOut(p);
    track.style.transform = `translateY(${y}px)`;
    if(p<1){ requestAnimationFrame(frame); }
    else { scrolling=false; curIdx=target; slideActivate(target); }
  }
  requestAnimationFrame(frame);
}

async function boot(){
  deck = await buildDeck();
  motionCounter = 0;
  reels.innerHTML = `<div id="track">${deck.map((w,i)=>slideHTML(w,i)).join('')}${endSlideHTML()}</div>`;
  totalSlides = deck.length + 1;
  curIdx = 0;
  document.getElementById('track').style.transform = 'translateY(0)';
  renderDots();
  slideActivate(0);
  document.getElementById('finishBtn').onclick = startSpellTest;

  // 시작 가이드
  const g=document.getElementById('guide');
  document.getElementById('guideClose').onclick=()=>{
    if(document.getElementById('guideNoShow').checked) localStorage.setItem('wordsec_guide','off');
    g.classList.add('guide-hidden');
  };
  if(localStorage.getItem('wordsec_guide')!=='off') g.classList.remove('guide-hidden');

  // 휠/터치로 인덱스 이동
  let wheelLock=false;
  reels.addEventListener('wheel', e=>{
    e.preventDefault();
    if(wheelLock||scrolling) return;
    wheelLock=true; setTimeout(()=>wheelLock=false, 200);
    scrollToIndex(curIdx + (e.deltaY>0?1:-1));
  }, {passive:false});
  let tx0=0, ty0=0, tmoved=false;
  reels.addEventListener('touchstart', e=>{ tx0=e.touches[0].clientX; ty0=e.touches[0].clientY; tmoved=false; }, {passive:true});
  reels.addEventListener('touchmove', e=>{ if(Math.abs(e.touches[0].clientY-ty0)>10||Math.abs(e.touches[0].clientX-tx0)>10) tmoved=true; }, {passive:true});
  reels.addEventListener('touchend', e=>{
    if(!tmoved || scrolling) return;
    const dx = e.changedTouches[0].clientX - tx0;
    const dy = e.changedTouches[0].clientY - ty0;
    if(Math.abs(dx)>Math.abs(dy)){ // 가로 = 예문
      if(dx<-50 && curIdx<deck.length) openExample(curIdx);
    } else if(Math.abs(dy)>40){ // 세로 = 스크롤
      scrollToIndex(curIdx + (dy<0?1:-1));
    }
  });
}
function startSpellTest(){
  const queue = Object.keys(sessionVotes).filter(en=>sessionVotes[en]==='dont')
    .map(en=> deck.find(w=>w.en===en) || wrongPool.find(w=>w.en===en))
    .filter(w=>w && !w.isIdiom);
  let qi=0;
  const app=document.getElementById('app');
  function draw(){
    if(qi>=queue.length) return renderEnd();
    const w = queue[qi];
    app.innerHTML = `
      <div class="spell-wrap">
        <div class="spell-tag">메타인지 테스트 · ${qi+1}/${queue.length}</div>
        <div class="spell-card">
          <div class="ko">${w.meaning}</div>
          <input id="spellInput" placeholder="영어로 써보세요" autocomplete="off" autocapitalize="off">
          <div class="answer" id="answerLine" style="display:none;"></div>
          <div class="flash-pop" id="flashPop">⚡ 어드밴티지 +1</div>
          <button id="spellSubmit">확인</button>
        </div>
      </div>`;
    const input=document.getElementById('spellInput'); input.focus();
    function submit(){
      const val=input.value.trim().toLowerCase();
      const ok = val===w.en.toLowerCase();
      input.classList.add(ok?'correct':'incorrect');
      if(ok){
        advantage++; sj(LS_ADV, advantage);
        wrongPool = wrongPool.filter(p=>p.en!==w.en); sj(LS_WRONG, wrongPool);
        document.getElementById('flashPop').classList.add('show');
      } else {
        document.getElementById('answerLine').style.display='block';
        document.getElementById('answerLine').textContent = `정답: ${w.en}`;
      }
      document.getElementById('spellSubmit').style.display='none';
      input.disabled=true;
      setTimeout(()=>{ qi++; draw(); }, 1200);
    }
    document.getElementById('spellSubmit').onclick=submit;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  }
  draw();
}
function renderEnd(){
  const knowList = Object.keys(sessionVotes).filter(en=>sessionVotes[en]==='know')
    .map(en=> deck.find(w=>w.en===en) || {en, meaning:''});
  const dontList = Object.keys(sessionVotes).filter(en=>sessionVotes[en]==='dont')
    .map(en=> deck.find(w=>w.en===en) || {en, meaning:''});
  const wrongToday = dontList;
  const today = new Date();
  const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
  const setTitle = `#${window.__setCode||''} ${window.__setFirstWord||''} 세트`;

  document.getElementById('app').innerHTML = `<div id="end"></div>`;
  const end=document.getElementById('end');
  end.innerHTML = `
    <div class="endHeader">
      <div class="endHeadL">
        <h2>${setTitle}</h2>
        <div class="setdate">${dateStr}</div>
      </div>
      <button class="endToggle" id="endFilter">
        <span class="knob" id="endKnob">🌙</span>
        <span class="elabel r">Got it!</span>
        <span class="elabel l">Again!</span>
      </button>
    </div>
    <div id="stackList"></div>
    <button class="kakao-btn" id="kakaoBtn">저장안하면 날라감. 카톡으로 복사해</button>
    <button class="share-btn" id="homeBtn2">홈으로</button>
    <button class="share-btn" id="restartBtn">현재 세트 다시 시작</button>
  `;

  let filterDark = true; // 기본: Again(모르는거) 표시
  const CARD_H=125, PEEK=42; // 겹침 2/3, 하단 1/3(42px) 노출
  let openIdx = -1, scrollOff = 0; // scrollOff: 위로 축적된 스크롤(카드 수)
  let curList = [];
  function drawList(){
    curList = filterDark ? dontList : knowList;
    const wrap = document.getElementById('stackList');
    openIdx = -1; scrollOff = 0;
    if(!curList.length){ wrap.style.height='60px'; wrap.innerHTML = `<p style="text-align:center; opacity:.5; font-size:13px;">${filterDark?'몰라요 표시한 단어 없음':'알아요 표시한 단어 없음'}</p>`; return; }
    wrap.innerHTML = curList.map((w,k)=>`
      <div class="wcard" id="wc-${k}" data-k="${k}">
        <div class="en">${w.en}</div>
        <div class="ko" id="wko-${k}"></div>
      </div>`).join('');
    layout();
    attachBoardGesture();
  }
  function layout(){
    const boardH = 125 + Math.max(0, curList.length-3)*PEEK + 40;
    const wrap=document.getElementById('stackList');
    wrap.style.height = boardH+'px';
    curList.forEach((w,k)=>{
      const el=document.getElementById('wc-'+k);
      const isOpen = k===openIdx;
      const baseY = (k - scrollOff) * PEEK;
      const jx = ((k*37)%7 - 3); // -3~3px 미세 좌우
      const rot = ((k*53)%5 - 2) * 0.6; // -1.2~1.2deg 미세 회전
      if(isOpen){
        el.style.transform = `translate(0,${baseY-10}px) scale(1.2) rotate(0deg)`;
        el.style.zIndex = 999;
      } else {
        el.style.transform = `translate(${jx}px,${baseY}px) rotate(${rot}deg)`;
        el.style.zIndex = k+1;
      }
      el.classList.toggle('open', isOpen);
    });
  }
  function openCard(k){
    openIdx = (openIdx===k) ? -1 : k;
    if(openIdx===k){ const koEl=document.getElementById('wko-'+k); koEl.textContent=''; playEnter(koEl, curList[k].meaning); }
    if(navigator.vibrate) navigator.vibrate(8);
    layout();
  }
  function attachBoardGesture(){
    const wrap=document.getElementById('stackList');
    let sx=0, sy=0, lx=0, ly=0, drag=false, startK=-1;
    function start(x,y,target){ drag=true; sx=x; sy=y; lx=x; ly=y; const c=target.closest('.wcard'); startK=c?+c.dataset.k:-1; }
    function move(x,y){ if(drag){ lx=x; ly=y; } }
    function end(){
      if(!drag) return; drag=false;
      const dx=lx-sx, dy=ly-sy, dist=Math.hypot(dx,dy);
      if(dist<12){ if(startK>=0) openCard(startK); return; } // 이동 거의 없음 = 탭
      if(openIdx>=0){ openIdx=-1; layout(); return; } // 열린 상태 스와이프 = 닫기
      if(Math.abs(dy)>36){ // 세로 스와이프 = 스크롤
        scrollOff = Math.min(Math.max(0, scrollOff + (dy<0?1:-1)), Math.max(0,curList.length-3));
        layout();
      }
    }
    wrap.addEventListener('pointerdown', e=> start(e.clientX,e.clientY,e.target));
    wrap.addEventListener('pointermove', e=> move(e.clientX,e.clientY));
    wrap.addEventListener('pointerup', end);
    wrap.addEventListener('pointercancel', end);
    wrap.addEventListener('touchstart', e=>{ const t=e.touches[0]; start(t.clientX,t.clientY,e.target); }, {passive:true});
    wrap.addEventListener('touchmove', e=>{ const t=e.touches[0]; move(t.clientX,t.clientY); }, {passive:true});
    wrap.addEventListener('touchend', end);
  }
  drawList();

  const endFilter = document.getElementById('endFilter');
  const endKnob = document.getElementById('endKnob');
  end.classList.add('dark'); // 기본 Again 상태
  endFilter.classList.add('dark');
  endFilter.onclick = ()=>{
    filterDark = !filterDark;
    end.classList.toggle('dark', filterDark);
    endFilter.classList.toggle('dark', filterDark);
    endKnob.textContent = filterDark ? '🌙' : '☀️';
    if(navigator.vibrate) navigator.vibrate(8);
    drawList();
  };

  document.getElementById('restartBtn').onclick=()=>location.reload();
  document.getElementById('homeBtn2').onclick=()=>{ location.href='./index.html'; };
  const kb = document.getElementById('kakaoBtn');
  if(kb) kb.onclick=()=>{
    const code = window.__setCode || ('A'+Date.now().toString().slice(-4));
    const txt = wrongToday.map(w=>`${w.en},${w.meaning}`).join('\n');
    navigator.clipboard.writeText(`${setTitle} · ${dateStr}\nSET:${code}\n${txt}`).then(()=>{ kb.textContent='복사됨!'; });
  };
}

boot();
</script>
</body>
</html>
